plugins {
  id 'com.android.application'
  id 'com.facebook.react'       // RN 0.73 の Gradle プラグイン
  id 'org.jetbrains.kotlin.android'
}

/* ← react { jsEngine = "jsc" } は削除（無効なプロパティ） */

ext.react = [ enableHermes: false ]   // 互換のため残しても害なし（実切替は gradle.properties）

// Autolink（PackageList 生成）
apply from: "$rootDir/../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"
applyNativeModulesAppBuildGradle(project)

android {
  namespace "com.anonymous.cocolonmvp"
  compileSdkVersion 34

  defaultConfig {
    applicationId "com.anonymous.cocolonmvp"
    minSdkVersion 24
    targetSdkVersion 34
    versionCode 1
    versionName "1.0.0"

    buildConfigField "boolean", "NEW_ARCH_ENABLED", "false"
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
    buildConfigField "boolean", "IS_HERMES_ENABLED", "false"

    multiDexEnabled true
  }

  signingConfigs {
    debug {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
      minifyEnabled true
      shrinkResources false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
    release {
      signingConfig signingConfigs.debug
      minifyEnabled true
      shrinkResources false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions { jvmTarget = "17" }

  packagingOptions {
    pickFirsts += [
      '**/libc++_shared.so'
    ]
    excludes += [
      'com/unity3d/ads/BuildConfig.class',
      'com/unity3d/ads/BuildConfig$*.class',
      'lib/**/libhermes.so',
      'lib/**/libhermes-executor-debug.so',
      'lib/**/libhermes-executor-release.so',
      'lib/**/libhermes-inspector.so'
    ]
  }
}

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }  // BlurView 用
  flatDir { dirs "$projectDir/libs", "$rootDir/libs" }   // Unity AAR
}

dependencies {
  // RN 本体（固定運用のままでOK）
  implementation("com.facebook.react:react-android:0.73.9") {
    exclude group: "com.facebook.react", module: "hermes-android"
    exclude group: "com.facebook.react", module: "hermes-engine"
    exclude group: "com.facebook",       module: "hermes"
  }

  coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
  implementation "androidx.core:core-splashscreen:1.0.1"
  implementation "com.google.android.material:material:1.12.0"
  implementation "androidx.multidex:multidex:2.0.1"
  implementation "androidx.appcompat:appcompat:1.7.0"

  // Unity AAR
  debugImplementation(name: "unityLibrary-debug", ext: "aar")
  releaseImplementation(name: "unityLibrary-release", ext: "aar")

  // JSC（Hermes無効時に必要）
  implementation(name: "android-jsc-r250231", ext: "aar")

  // 手動リンクはしない（Autolinkに任せる）
  // implementation project(':react-native-community_blur')
  // implementation project(':react-native-linear-gradient')
}
