plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'com.facebook.react'
}

react {
  autolinkLibrariesWithApp()
}

// --- Release signing (Emlis) ---
def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
  keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))
} else {
  throw new GradleException('Missing key.properties for release signing. Create android/key.properties before building a release.')
}

android {
  namespace 'com.anonymous.cocolonmvp'
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    applicationId 'com.anonymous.cocolonmvp'
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
    versionCode 14
    versionName '1.0.0'

    buildConfigField 'boolean', 'NEW_ARCH_ENABLED', 'false'
    buildConfigField 'boolean', 'IS_NEW_ARCHITECTURE_ENABLED', 'false'
    buildConfigField 'boolean', 'IS_HERMES_ENABLED', 'true'

    multiDexEnabled true
    missingDimensionStrategy 'store', 'play'

    ndk {
      abiFilters 'arm64-v8a', 'x86_64'
    }

    externalNativeBuild {
      cmake {
        arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
      }
    }
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }

    release {
      storeFile file(keystoreProperties['storeFile'])
      storePassword keystoreProperties['storePassword']
      keyAlias keystoreProperties['keyAlias']
      keyPassword keystoreProperties['keyPassword']
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled true
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  packagingOptions {
    jniLibs {
      pickFirsts += ['**/libc++_shared.so']
    }
    resources {
      excludes += [
        'com/unity3d/ads/BuildConfig.class',
        'com/unity3d/ads/BuildConfig$*.class',
      ]
    }
  }
}

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation('com.facebook.react:react-android')
  implementation('com.facebook.react:hermes-android')

  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
  implementation 'androidx.core:core-splashscreen:1.0.1'
  implementation 'com.google.android.material:material:1.12.0'
  implementation 'androidx.multidex:multidex:2.0.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'

  implementation('com.github.Dimezis:BlurView') {
    version { strictly 'version-1.6.6' }
  }
}

apply from: '../../node_modules/react-native-vector-icons/fonts.gradle'
apply plugin: 'com.google.gms.google-services'
