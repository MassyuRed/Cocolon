# JVM メモリ設定（既存方針を維持）
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle Daemon 無効化（ヒープ設定の取りこぼしを防ぐ）
org.gradle.daemon=false

# Gradle のワーカー数を 1 に固定（D8/R8 の並列ワーカー増殖を抑止）
org.gradle.workers.max=1

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# 16 KB 対応のため 64-bit ABI のみに限定
# react-native-screens は 32-bit ABI で 16 KB ページサイズ警告が残る報告があるため、
# まずは Play 提出を安定させる構成に寄せる。
reactNativeArchitectures=arm64-v8a,x86_64

# 新アーキは今回の対応では有効化しない
newArchEnabled=false

# JS エンジン
hermesEnabled=true

# 並列ビルド OFF（追加の保険）
org.gradle.parallel=false

# Dexing Transform（既存設定を維持）
android.useFullClasspathForDexingTransform=true
