# JVM メモリ設定（強化版）
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle Daemon 無効化（ヒープ設定の取りこぼしを防ぐ）
org.gradle.daemon=false

# Gradle のワーカー数を 1 に固定（D8/R8 の並列ワーカー増殖を抑止）
org.gradle.workers.max=1

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# ビルド対象アーキテクチャ
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# 新アーキ有効化 (TurboModules/Fabric)
newArchEnabled=false

# JSエンジン (Hermes/JSC)
hermesEnabled=false

# 並列ビルド OFF（追加の保険）
org.gradle.parallel=false

# Dexing Transform（AGP 8.3+ の推奨）
android.useFullClasspathForDexingTransform=true

# ------------------------------------
# Unity 有効化フラグ
# MainApplication.java は UNITY_ENABLED を参照するため大文字で定義
# ------------------------------------
UNITY_ENABLED=true


