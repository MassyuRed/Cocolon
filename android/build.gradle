// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '1.9.22'
    }
    repositories {
        google()
        mavenCentral()
        // Gradle Plugin Portal は保険で残す（不要なら消してもOK）
        gradlePluginPortal()
        // ❌ React Native AAR のための node_modules 参照は settings.gradle に集約したのでここでは不要
        // maven { url("$rootDir/../node_modules/react-native/android") }
    }
    dependencies {
        // ✅ Android Gradle Plugin
        classpath("com.android.tools.build:gradle:8.3.2")
        // ✅ Kotlin Gradle Plugin
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}")
        // ❌ React Native Gradle Plugin は未使用（classpath を追加しない）
    }
}

// ❌ Kotlin の jvmTarget はモジュール側（例: android/app/build.gradle）に記述する方針に統一
// ここ（root）では指定しない。
