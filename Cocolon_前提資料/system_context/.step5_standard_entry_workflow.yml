name: Cocolon System Context Steps 1-5 standard entry
run-name: Cocolon System Context Step 5 @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - tools/cocolon_context.py
      - tools/cocolon_context_prepare.py
      - tools/cocolon_context_task.py
      - tools/cocolon_context_inventory.py
      - tools/cocolon_context_code_index.py
      - tools/cocolon_context_routes.py
      - tools/cocolon_context_publish_transport.py
      - tools/cocolon_context_ts_syntax.cjs
      - tools/cocolon_context_ts_routes.cjs
      - tests/cocolon_context/**
      - tests/cocolon_context_step4/**
      - Cocolon_前提資料/system_context/workspace_profiles.json
      - Cocolon_前提資料/system_context/task_profiles.json
      - Cocolon_前提資料/system_context/00_read_first.md
      - Cocolon_前提資料/work_attitude_rules_for_karen/00_read_first.txt
      - .github/context-payloads/step2-code/**
      - .github/context-payloads/step3/**
      - .github/context-payloads/step3-c/**
      - .github/context-payloads/step3-ts-routes/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cocolon-system-context-step5-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  connect-standard-entry:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      MASHOS_COMMIT: 06ce311b3ea728b06f83439d268a34bed917c01c
      CYCLE001_MASHOS_COMMIT: 958c1b53f5b5894691e0b10e2d991fb8236d9f6f
      ROOT: Cocolon_前提資料/system_context/current/cmee_working
      EXTERNAL_ROOT: .cocolon-context-workspace
    steps:
      - name: Checkout exact Cocolon source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git status --porcelain)" = ""

      - name: Checkout locked mashos-api read-only
        uses: actions/checkout@v4
        with:
          repository: MassyuRed/mashos-api
          ref: 06ce311b3ea728b06f83439d268a34bed917c01c
          path: .cocolon-context-workspace/mashos-api
          fetch-depth: 0

      - name: Assert mashos-api identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$EXTERNAL_ROOT/mashos-api" rev-parse HEAD)" = "$MASHOS_COMMIT"
          test "$(git -C "$EXTERNAL_ROOT/mashos-api" status --porcelain)" = ""

      - name: Checkout Cycle001 exact review asset read-only
        uses: actions/checkout@v4
        with:
          repository: MassyuRed/mashos-api
          ref: 958c1b53f5b5894691e0b10e2d991fb8236d9f6f
          path: .cocolon-context-workspace/cycle001_working/mashos-api
          fetch-depth: 0

      - name: Assert Cycle001 exact review asset identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$EXTERNAL_ROOT/cycle001_working/mashos-api" rev-parse HEAD)" = "$CYCLE001_MASHOS_COMMIT"
          test "$(git -C "$EXTERNAL_ROOT/cycle001_working/mashos-api" status --porcelain)" = ""

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned SCIP exact3 toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --no-audit --no-fund \
            @sourcegraph/scip-typescript@0.4.0 \
            @sourcegraph/scip-python@0.6.6 \
            typescript@5.2.2
          export NODE_PATH="$(npm root -g)"
          echo "NODE_PATH=${NODE_PATH}" >> "$GITHUB_ENV"
          SCIP_TAG=v0.7.1
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/scip-code/scip/releases/download/${SCIP_TAG}/scip-linux-amd64.tar.gz" \
            -o /tmp/scip.tar.gz
          rm -rf /tmp/scip-bin
          mkdir -p /tmp/scip-bin
          tar -xzf /tmp/scip.tar.gz -C /tmp/scip-bin
          SCIP_BIN="$(find /tmp/scip-bin -type f -name scip -print -quit)"
          test -n "$SCIP_BIN"
          sudo install "$SCIP_BIN" /usr/local/bin/scip
          test "$(node -e "console.log(require('typescript').version)")" = "5.2.2"
          test "$(scip --version)" = "scip version v0.7.1"
          test "$(scip-typescript --version)" = "0.4.0"
          test "$(scip-python --version)" = "0.6.6"

      - name: Run Step 1-5 regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/cocolon_context_ts_syntax.cjs
          node --check tools/cocolon_context_ts_routes.cjs
          python3 -m py_compile \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py \
            tools/cocolon_context_task.py \
            tools/cocolon_context_inventory.py \
            tools/cocolon_context_code_index.py \
            tools/cocolon_context_routes.py \
            tools/cocolon_context_publish_transport.py
          python3 -m unittest discover -s tests/cocolon_context -p 'test_*.py' -v
          git diff --check

      - name: Prepare changed ref through Steps 1-4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EXTERNAL_ROOT/prepare"
          python3 -m tools.cocolon_context prepare \
            --workspace cmee_working \
            --task cmee
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("Cocolon_前提資料/system_context/current/cmee_working")
          receipt = json.loads((root / "prepare_summary.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "PENDING_REMOTE_VERIFICATION"
          assert receipt["refresh_plan"]["execution_mode"] == "FULL_REBUILD_FALLBACK"
          assert receipt["changed_ref_refresh_verified"] is True
          assert receipt["full_rebuild_fallback_verified"] is True
          assert receipt["manual_operation_count"] == 0
          assert receipt["product_credit"] == 0
          assert receipt["automatic_progression"] is False
          assert receipt["resolved_refs"]["Cocolon"]["commit"] == __import__("os").environ["SOURCE_COMMIT"]
          assert receipt["resolved_refs"]["mashos-api"]["commit"] == __import__("os").environ["MASHOS_COMMIT"]
          PY

      - name: Commit and push generated changed-ref context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$ROOT"
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore(system-context): generate Step 5 changed-ref context"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "PENDING_GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify same-ref no-op from distinct fresh clone
        shell: bash
        run: |
          set -euo pipefail
          FRESH=/tmp/cocolon-step5-fresh-pending
          rm -rf "$FRESH"
          git clone --no-local "$GITHUB_WORKSPACE" "$FRESH"
          git -C "$FRESH" checkout --detach "$PENDING_GENERATED_COMMIT"
          mkdir -p "$FRESH/.cocolon-context-workspace"
          git clone --no-local "$GITHUB_WORKSPACE/$EXTERNAL_ROOT/mashos-api" \
            "$FRESH/.cocolon-context-workspace/mashos-api"
          git -C "$FRESH/.cocolon-context-workspace/mashos-api" checkout --detach "$MASHOS_COMMIT"
          mkdir -p "$FRESH/.cocolon-context-workspace/cycle001_working"
          git clone --no-local "$GITHUB_WORKSPACE/$EXTERNAL_ROOT/cycle001_working/mashos-api" \
            "$FRESH/.cocolon-context-workspace/cycle001_working/mashos-api"
          git -C "$FRESH/.cocolon-context-workspace/cycle001_working/mashos-api" checkout --detach "$CYCLE001_MASHOS_COMMIT"
          BEFORE="$(cd "$FRESH" && python3 -c 'import json; print(json.load(open("Cocolon_前提資料/system_context/current/cmee_working/prepare_summary.json"))["task_context"]["context_fingerprint"])')"
          (
            cd "$FRESH"
            python3 -m tools.cocolon_context prepare \
              --workspace cmee_working \
              --task cmee \
              --verify-only
            git diff --exit-code -- .
            git diff --cached --exit-code -- .
          )
          AFTER="$(cd "$FRESH" && python3 -c 'import json; print(json.load(open("Cocolon_前提資料/system_context/current/cmee_working/prepare_summary.json"))["task_context"]["context_fingerprint"])')"
          test "$BEFORE" = "$AFTER"

      - name: Seal Step 4 and Step 5 after fresh-clone proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.cocolon_context prepare \
            --workspace cmee_working \
            --task cmee \
            --remote-verified \
            --fresh-clone-verified
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("Cocolon_前提資料/system_context/current/cmee_working")
          receipt = json.loads((root / "prepare_summary.json").read_text(encoding="utf-8"))
          context = json.loads((root / "task_context/cmee/context_manifest.json").read_text(encoding="utf-8"))
          assert context["status"] == "STEP4_TASK_CONTEXT_COMPILER_CMEE_ACTUAL_REVIEW_COMPLETE"
          assert receipt["status"] == "COMPLETE"
          assert receipt["same_ref_reuse_verified"] is True
          assert receipt["changed_ref_refresh_verified"] is True
          assert receipt["full_rebuild_fallback_verified"] is True
          assert receipt["fresh_clone_deterministic_verified"] is True
          assert receipt["completion_claim"] == "STEP5_COCOLON_STANDARD_ENTRY_CONNECTED"
          assert receipt["overall_claim"] == "COCOLON_SYSTEM_CONTEXT_STEPS1_TO_5_COMPLETE"
          assert receipt["structure_map_delta"] == "STRUCTURE_MAP_DELTA_NONE"
          assert receipt["mashos_api_write_count"] == 0
          assert receipt["product_behavior_change_count"] == 0
          PY
          git add -A "$ROOT"
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore(system-context): seal Steps 1-5 remote completion"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Final fresh-clone deterministic and remote verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$FINAL_HEAD"
          FRESH=/tmp/cocolon-step5-fresh-final
          rm -rf "$FRESH"
          git clone --no-local "$GITHUB_WORKSPACE" "$FRESH"
          git -C "$FRESH" checkout --detach "$FINAL_HEAD"
          mkdir -p "$FRESH/.cocolon-context-workspace"
          git clone --no-local "$GITHUB_WORKSPACE/$EXTERNAL_ROOT/mashos-api" \
            "$FRESH/.cocolon-context-workspace/mashos-api"
          git -C "$FRESH/.cocolon-context-workspace/mashos-api" checkout --detach "$MASHOS_COMMIT"
          mkdir -p "$FRESH/.cocolon-context-workspace/cycle001_working"
          git clone --no-local "$GITHUB_WORKSPACE/$EXTERNAL_ROOT/cycle001_working/mashos-api" \
            "$FRESH/.cocolon-context-workspace/cycle001_working/mashos-api"
          git -C "$FRESH/.cocolon-context-workspace/cycle001_working/mashos-api" checkout --detach "$CYCLE001_MASHOS_COMMIT"
          (
            cd "$FRESH"
            python3 -m tools.cocolon_context prepare \
              --workspace cmee_working \
              --task cmee \
              --verify-only \
              --require-remote-verified
            git diff --exit-code -- .
            git diff --cached --exit-code -- .
          )

      - name: Update Draft PR 31 with final actual
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("Cocolon_前提資料/system_context/current/cmee_working")
          receipt = json.loads((root / "prepare_summary.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          code = json.loads((root / "code_index/code_index_summary.json").read_text(encoding="utf-8"))
          routes = json.loads((root / "route_graph/route_graph_summary.json").read_text(encoding="utf-8"))
          task = json.loads((root / "task_context/cmee/context_manifest.json").read_text(encoding="utf-8"))
          body = f"""## Cocolon System Context — Steps 1–5 final actual

          `COCOLON_SYSTEM_CONTEXT_STEPS1_TO_5_COMPLETE`

          ### Remote identity
          - source commit: `{os.environ['SOURCE_COMMIT']}`
          - final HEAD: `{os.environ['FINAL_HEAD']}`
          - final tree: `{os.environ['FINAL_TREE']}`
          - mashos-api read-only commit: `{os.environ['MASHOS_COMMIT']}`

          ### Step results
          - Step 1: `{manifest['completion_claim']}` / tracked `{manifest['total_tracked_entries']}` / missing `0` / duplicate `0`
          - Step 2: `{code['completion_claim']}` / coverage `{code['coverage_total']}` / gap `0`
          - Step 3: `{routes['completion_claim']}` / silent unresolved `{routes['silent_unresolved_count']}`
          - Step 4: `{task['status']}` / selected `{task['selected_file_count']}` / closure `{task['closure_edge_count']}` / blocking unresolved `{task['blocking_unresolved_count']}` / fingerprint `{task['context_fingerprint']}`
          - Step 5: `{receipt['completion_claim']}` / same-ref reuse `{receipt['same_ref_reuse_verified']}` / changed-ref refresh `{receipt['changed_ref_refresh_verified']}` / bounded full-rebuild fallback `{receipt['full_rebuild_fallback_verified']}` / fresh clone `{receipt['fresh_clone_deterministic_verified']}`

          ### Standard entry
          ```bash
          python3 -m tools.cocolon_context prepare --workspace cmee_working --task cmee
          ```

          Routing owner: `Cocolon_前提資料/work_attitude_rules_for_karen/00_read_first.txt`
          Technical owner: `Cocolon_前提資料/system_context/00_read_first.md`

          ### Boundaries
          - Draft / open / unmerged
          - mashos-api write: `0`
          - CMEE runtime change: `0`
          - Cycle001 restart: `0`
          - production behavior change: `0`
          - RN / API / DB change: `0`
          - product-quality credit: `0`
          - `STRUCTURE_MAP_DELTA_NONE`
          - automatic progression: `false`
          """
          Path("/tmp/pr-body.md").write_text("\n".join(line.strip() for line in body.splitlines()) + "\n", encoding="utf-8")
          PY
          gh pr edit 31 \
            --title "feat(system-context): connect Cocolon standard entry through Step 5" \
            --body-file /tmp/pr-body.md
