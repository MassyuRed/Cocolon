      phone.querySelectorAll('[data-field]').forEach(f=>{
        const key=f.dataset.field;
        if(f.type==='checkbox')f.checked=state[key];else if(f.value!==state[key])f.value=state[key];
      });
      phone.querySelector('[data-theme-label]').textContent=paletteNames[state.palette];
      phone.querySelector('[data-ratio-caption]').textContent=state.ratio;
      const art=phone.querySelector('[data-artwork]');
      art.className='c-artwork c-palette-'+state.palette;
      art.style.aspectRatio=state.ratio==='4:5'?'4 / 5':'9 / 16';
      phone.querySelector('[data-artwork-brand]').style.visibility=state.logo?'visible':'hidden';
      phone.querySelector('[data-piece-action]').textContent=state.action;
      phone.querySelector('[data-piece-thought]').textContent=state.thought;
      phone.dataset.preferenceTheme=state.appTheme;
      phone.querySelectorAll('.c-bottom-nav button').forEach(b=>{
        const viewForAction={home:'home','nav-analysis':'analysis','nav-piece':'piece','nav-settings':'settings'};
        const current=viewForAction[b.dataset.action]===state.view;
        b.classList.toggle('is-current',current);
        if(current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
      });
      phone.querySelectorAll('[data-analysis-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.analysisMode===state.analysisMode)));
      phone.querySelectorAll('[data-analysis-panel]').forEach(p=>p.hidden=p.dataset.analysisPanel!==state.analysisMode);
      phone.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.period===state.period)));
      const weather=weatherData[state.period];
      const total=weather.counts.reduce((a,b)=>a+b,0);
      phone.querySelector('[data-weather-range]').textContent=weather.range;
      phone.querySelector('[data-weather-eyebrow]').textContent=weather.eyebrow;
      phone.querySelector('[data-weather-title]').textContent=weather.title;
      phone.querySelector('[data-weather-copy]').textContent=weather.copy;
      phone.querySelector('[data-record-count]').textContent=String(total);
      const legend=phone.querySelector('[data-mood-legend]');
      legend.replaceChildren();
      let cumulative=0;
      const stops=[];
      moodData.forEach((m,index)=>{
        const row=document.createElement('div');
        const dot=document.createElement('span');dot.className='c-mood-dot c-dot-'+m.key;
        const count=document.createElement('strong');count.textContent=String(weather.counts[index]);
        row.append(dot,document.createTextNode(m.name),count);legend.append(row);
        const start=cumulative; cumulative+=weather.counts[index]/total*100;
        stops.push('var(--c-mood-'+m.key+') '+start+'% '+cumulative+'%');
      });
      const ring=phone.querySelector('[data-mood-ring]');
      ring.style.background='conic-gradient('+stops.join(',')+')';
      ring.setAttribute('aria-label',String(total)+'件の記録：'+moodData.map((m,i)=>m.name+weather.counts[i]+'件').join('、'));
      phone.querySelector('[data-week-section]').hidden=state.period!=='week';
      phone.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.day)===state.day)));
      const record=dayData[state.period==='day'?5:state.day];
      phone.querySelector('[data-memory-date]').textContent=record.label;
      phone.querySelector('[data-memory-text]').textContent=record.text;
      phone.querySelector('[data-record-heading]').textContent=record.date+'の記録';
      phone.querySelector('[data-record-body]').textContent=record.body;
      phone.querySelector('[data-weather-record]').hidden=!state.weatherRecord;
      phone.querySelector('[data-evidence-panel]').hidden=!state.mapEvidence;
      phone.querySelector('[data-evidence-text]').textContent=evidenceTexts[state.mapEvidence]||'';
      phone.querySelectorAll('[data-evidence]').forEach(b=>b.setAttribute('aria-expanded',String(state.mapEvidence===b.dataset.evidence)));
      phone.querySelector('[data-map-compare]').hidden=!state.mapCompare;
      phone.querySelectorAll('[data-settings-panel]').forEach(b=>b.setAttribute('aria-expanded',String(state.settingsPanel===b.dataset.settingsPanel)));
      phone.querySelectorAll('[data-setting-content]').forEach(p=>p.hidden=p.dataset.settingContent!==state.settingsPanel);
      phone.querySelectorAll('[data-app-theme]').forEach(b=>b.setAttribute('aria-pressed',String(state.appTheme===b.dataset.appTheme)));
      phone.querySelector('[data-current-theme]').textContent=themeNames[state.appTheme];
      phone.querySelector('[data-notification-summary]').textContent=state.notifications.all?'オン':'オフ';
      phone.querySelectorAll('[data-setting-notification]').forEach(input=>{
        input.checked=state.notifications[input.dataset.settingNotification];
        input.disabled=input.dataset.settingNotification!=='all'&&!state.notifications.all;
      });
    });
    requestAnimationFrame(equalize);
  }
  function setView(view){
    state.view=view;
    phones.forEach(p=>{p.querySelector('[data-modal-layer]').hidden=true;p.querySelector('[data-toast]').hidden=true;p.querySelectorAll('[data-app-view]').forEach(v=>v.inert=false);});
    const viewNames={home:'ホーム',piece:'Pieceのプレビュー',analysis:'分析',settings:'設定'};
    sync();announce(viewNames[view]+'を表示');
  }
  function toast(phone,message){
    clearTimeout(toastTimers.get(phone));
    const node=phone.querySelector('[data-toast]');
    node.querySelector('span').textContent=message;node.hidden=false;
    toastTimers.set(phone,setTimeout(()=>node.hidden=true,2600));
  }
  root.addEventListener('input',event=>{
    const notification=event.target.closest('[data-setting-notification]');
    if(notification){state.notifications[notification.dataset.settingNotification]=notification.checked;sync();return;}
    const field=event.target.closest('[data-field]');
    if(!field)return;
    const key=field.dataset.field;
    state[key]=field.type==='checkbox'?field.checked:field.value;
    sync();
  });
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.previewView){setView(button.dataset.previewView);return;}
    const phone=button.closest('.c-device');if(!phone)return;
    if(button.dataset.emotion){state.emotion=button.dataset.emotion;sync();return;}
    if(button.dataset.intensity){state.intensity=button.dataset.intensity;sync();return;}
    if(button.dataset.category){
      const c=button.dataset.category;
      if(state.categories.has(c))state.categories.delete(c);else state.categories.add(c);
      sync();return;
    }
    if(button.dataset.palette){state.palette=button.dataset.palette;sync();announce(paletteNames[state.palette]+'を選択');return;}
    if(button.dataset.ratio){state.ratio=button.dataset.ratio;sync();return;}
    if(button.dataset.analysisMode){state.analysisMode=button.dataset.analysisMode;sync();return;}
    if(button.dataset.period){state.period=button.dataset.period;state.weatherRecord=false;sync();return;}
    if(button.dataset.day!==undefined){state.day=Number(button.dataset.day);state.weatherRecord=true;sync();return;}
    if(button.dataset.evidence){state.mapEvidence=state.mapEvidence===button.dataset.evidence?null:button.dataset.evidence;sync();return;}
    if(button.dataset.settingsPanel){state.settingsPanel=state.settingsPanel===button.dataset.settingsPanel?null:button.dataset.settingsPanel;sync();return;}
    if(button.dataset.appTheme){state.appTheme=button.dataset.appTheme;sync();announce(themeNames[state.appTheme]+'を選択');return;}
    const action=button.dataset.action;
    if(action==='home'||action==='back-home'){setView('home');return;}
    if(action==='nav-analysis'){setView('analysis');return;}
    if(action==='nav-settings'){setView('settings');return;}
    if(action==='nav-piece'){setView('piece');return;}
    if(action==='weather-record'){state.weatherRecord=!state.weatherRecord;sync();return;}
    if(action==='map-history'){state.mapCompare=!state.mapCompare;sync();return;}
    if(action==='analysis-history'){
      if(state.analysisMode==='map')state.mapCompare=!state.mapCompare;else state.weatherRecord=!state.weatherRecord;
      sync();return;
    }
    if(action==='account'){setView('settings');return;}
    if(action==='submit'){
      const valid=(state.thought.trim()||state.action.trim())&&state.categories.size;
      phone.querySelector('[data-input-error]').hidden=!!valid;
      if(!valid)return;
      const layer=phone.querySelector('[data-modal-layer]');
      layer.hidden=false;
      phone.querySelector('[data-app-view="home"]').inert=true;
      const para=layer.querySelector('p');
      para.textContent='「'+(state.thought.trim()||state.action.trim())+'」と書いてくれたのですね。';
      layer.querySelector('[data-action="create-piece"]').focus({preventScroll:true});
      return;
    }
    if(action==='close-modal'){phone.querySelector('[data-modal-layer]').hidden=true;phone.querySelector('[data-app-view="home"]').inert=false;phone.querySelector('[data-action="submit"]').focus({preventScroll:true});return;}
    if(action==='create-piece'){setView('piece');return;}
    if(action==='save-piece'){toast(phone,'Pieceを保存しました');return;}
    if(action==='cancel-piece'){setView('home');toast(phone,'候補を取り消しました');return;}
    const messages={history:'入力履歴は、今回の4画面には含めていません',question:'今日の問いは、表示の見本です',restore:'購入内容の復元は、試作では実行しません','manage-subscription':'ストアの契約管理は、試作では開きません',tutorial:'チュートリアルは、今回の試作には含めていません','logout-preview':'ログアウトは、試作では実行しません','delete-preview':'アカウント削除は、試作では実行しません',legal:'規約ページは、今回の試作には含めていません',support:'サポートページは、今回の試作には含めていません'};
    if(messages[action])toast(phone,messages[action]);
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      const activePhone=event.target.closest('.c-device');
      phones.forEach(phone=>{phone.querySelector('[data-modal-layer]').hidden=true;phone.querySelectorAll('[data-app-view]').forEach(v=>v.inert=false);});
      if(activePhone)activePhone.querySelector('[data-action="submit"]').focus({preventScroll:true});
    }
  });
  sync();iconRefresh();
  if(globalThis.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(equalize)).observe(root);
})();
</script>
