  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

    &quot;codex-visualization-widget-state&quot;,
  );

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,

      widgetState: state,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              sendHeight();

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

    @media(max-width:360px){#emlis-kokoro-weather-preview .weather-content{margin:0 15px}#emlis-kokoro-weather-preview .feature-tabs,#emlis-kokoro-weather-preview .mode-tabs{margin-left:15px;margin-right:15px}#emlis-kokoro-weather-preview .weather-card{padding:17px}#emlis-kokoro-weather-preview .day-distribution{grid-template-columns:130px 1fr;gap:11px}#emlis-kokoro-weather-preview .day-distribution&gt;.donut{width:130px!important;height:130px!important}#emlis-kokoro-weather-preview .legend-vertical{font-size:11px;gap:9px}#emlis-kokoro-weather-preview h2{font-size:17px}#emlis-kokoro-weather-preview .selected-day{padding:14px}#emlis-kokoro-weather-preview .selected-composition{grid-template-columns:62px 1fr;gap:10px}#emlis-kokoro-weather-preview .selected-legend{gap:9px 7px}}
  &lt;/style&gt;
  &lt;div class=&quot;preview-label&quot;&gt;画面案 · 架空の入力データ&lt;/div&gt;
  &lt;section class=&quot;emlis-phone&quot; aria-label=&quot;Emlis こころ天気の画面案&quot;&gt;
    &lt;div class=&quot;status-bar&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;21:40&lt;/span&gt;&lt;span class=&quot;status-icons&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;signal&quot;&gt;&lt;/i&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;wifi&quot;&gt;&lt;/i&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;battery-full&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;brand-row&quot;&gt;&lt;div class=&quot;brand&quot;&gt;Emlis&lt;/div&gt;&lt;span class=&quot;brand-history&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;history&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;feature-tabs&quot; aria-label=&quot;分析の種類&quot;&gt;&lt;div class=&quot;feature-tab current&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;cloud-sun&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;こころ天気&lt;/div&gt;&lt;div class=&quot;feature-tab&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;わたしマップ&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;mode-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;こころ天気の期間&quot;&gt;
      &lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; role=&quot;tab&quot; id=&quot;emlis-weather-day-tab&quot; aria-controls=&quot;emlis-weather-panel&quot; aria-selected=&quot;true&quot; data-mode=&quot;day&quot;&gt;今日&lt;/button&gt;
      &lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; role=&quot;tab&quot; id=&quot;emlis-weather-week-tab&quot; aria-controls=&quot;emlis-weather-panel&quot; aria-selected=&quot;false&quot; data-mode=&quot;week&quot;&gt;週&lt;/button&gt;
      &lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; role=&quot;tab&quot; id=&quot;emlis-weather-month-tab&quot; aria-controls=&quot;emlis-weather-panel&quot; aria-selected=&quot;false&quot; data-mode=&quot;month&quot;&gt;月&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;period-heading&quot;&gt;&lt;div&gt;&lt;h1 id=&quot;emlis-weather-heading&quot;&gt;今日の天気&lt;/h1&gt;&lt;div class=&quot;period-caption&quot; id=&quot;emlis-weather-period&quot;&gt;11月8日（日）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;period-arrows&quot; id=&quot;emlis-weather-arrows&quot; hidden&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; id=&quot;emlis-weather-prev&quot; aria-label=&quot;前の期間&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;chevron-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; id=&quot;emlis-weather-next&quot; aria-label=&quot;次の期間&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;weather-content&quot; id=&quot;emlis-weather-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;emlis-weather-day-tab&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;bottom-nav&quot; aria-label=&quot;アプリのナビゲーション&quot;&gt;
      &lt;div class=&quot;bottom-item&quot;&gt;&lt;span class=&quot;bottom-icon&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;house&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;ホーム&lt;/div&gt;
      &lt;div class=&quot;bottom-item active&quot;&gt;&lt;span class=&quot;bottom-icon&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;globe&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;分析&lt;/div&gt;
      &lt;div class=&quot;bottom-item&quot;&gt;&lt;span class=&quot;bottom-icon&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;box&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;ピース&lt;/div&gt;
      &lt;div class=&quot;bottom-item&quot;&gt;&lt;span class=&quot;bottom-icon&quot;&gt;&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;settings&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;設定&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;home-indicator-wrap&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;home-indicator&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;emlis-kokoro-weather-preview&#x27;);
      if (!root) return;
      const TODAY = &#x27;2026-11-08&#x27;;
      const moods = [
        {key:&#x27;joy&#x27;,label:&#x27;喜び&#x27;,color:&#x27;var(--mood-joy)&#x27;,icon:&#x27;sun&#x27;},
        {key:&#x27;sad&#x27;,label:&#x27;悲しみ&#x27;,color:&#x27;var(--mood-sad)&#x27;,icon:&#x27;cloud-rain&#x27;},
        {key:&#x27;anger&#x27;,label:&#x27;怒り&#x27;,color:&#x27;var(--mood-anger)&#x27;,icon:&#x27;cloud-lightning&#x27;},
        {key:&#x27;anxiety&#x27;,label:&#x27;不安&#x27;,color:&#x27;var(--mood-anxiety)&#x27;,icon:&#x27;cloud&#x27;},
        {key:&#x27;calm&#x27;,label:&#x27;平穏&#x27;,color:&#x27;var(--mood-calm)&#x27;,icon:&#x27;cloud-sun&#x27;}
      ];
      const zero = () =&gt; ({joy:0,sad:0,anger:0,anxiety:0,calm:0});
      const records = [
        {time:&#x27;08:10&#x27;,emotions:[[&#x27;joy&#x27;,2],[&#x27;anxiety&#x27;,1]]},
        {time:&#x27;09:45&#x27;,emotions:[[&#x27;anxiety&#x27;,2]]},
        {time:&#x27;12:30&#x27;,emotions:[[&#x27;anger&#x27;,1],[&#x27;anxiety&#x27;,2]]},
        {time:&#x27;15:20&#x27;,emotions:[[&#x27;calm&#x27;,2]]},
        {time:&#x27;18:40&#x27;,emotions:[[&#x27;joy&#x27;,2],[&#x27;calm&#x27;,3]]},
        {time:&#x27;21:10&#x27;,emotions:[[&#x27;calm&#x27;,2]]}
      ];
      const weightsOf = rows =&gt; rows.reduce((a,r) =&gt; {r.emotions.forEach(([k,v]) =&gt; a[k]+=v);return a;},zero());
      const days = {};
      for(let d=1;d&lt;=31;d++){
        const key=&#x27;2026-10-&#x27;+String(d).padStart(2,&#x27;0&#x27;);
        const missing=[7,13,19,25,29].includes(d);
        const w=missing?zero():{joy:1+d%2,sad:d%5===0?2:0,anger:d%6===0?2:0,anxiety:d&lt;=10?5:1,calm:d&gt;=21?6:2};
        if(!missing &amp;&amp; d&gt;10 &amp;&amp; d&lt;21) w.joy=5;
        days[key]={date:key,count:missing?0:2+d%4,weights:w};
      }
      [
        [1,4,[2,0,2,5,1]],[2,4,[1,2,1,5,1]],[3,4,[3,1,0,3,3]],
        [4,5,[0,1,2,4,3]],[5,0,[0,0,0,0,0]],[6,4,[2,0,1,2,5]],
        [7,5,[3,1,0,1,5]]
      ].forEach(([d,count,w])=&gt;{const date=&#x27;2026-11-&#x27;+String(d).padStart(2,&#x27;0&#x27;);days[date]={date,count,weights:Object.fromEntries(moods.map((m,i)=&gt;[m.key,w[i]]))};});
      days[TODAY]={date:TODAY,count:records.length,weights:weightsOf(records)};
      const state={mode:&#x27;day&#x27;,time:3,shifts:{week:0,month:0},selected:{week:TODAY,month:TODAY}};
      const body=root.querySelector(&#x27;#emlis-weather-panel&#x27;);
      const sum=w=&gt;moods.reduce((s,m)=&gt;s+(w[m.key]||0),0);
      const addDays=(iso,n)=&gt;{const p=iso.split(&#x27;-&#x27;).map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10);};
      const weekday=iso=&gt;&#x27;日月火水木金土&#x27;[new Date(iso+&#x27;T00:00:00Z&#x27;).getUTCDay()];
      const dateLabel=iso=&gt;`${Number(iso.slice(5,7))}月${Number(iso.slice(8))}日（${weekday(iso)}）`;
      const shortDate=iso=&gt;`${Number(iso.slice(5,7))}/${Number(iso.slice(8))}`;
      const getDay=iso=&gt;days[iso]||{date:iso,count:0,weights:zero()};
      const aggregate=items=&gt;items.reduce((a,d)=&gt;{moods.forEach(m=&gt;a[m.key]+=d.weights[m.key]||0);return a;},zero());
      const shares=w=&gt;{
        const total=sum(w);if(!total)return moods.map(()=&gt;0);
        const raw=moods.map(m=&gt;(w[m.key]||0)*100/total),out=raw.map(Math.floor);
        const ordered=raw.map((v,i)=&gt;({i,r:v-out[i]})).sort((a,b)=&gt;b.r-a.r||a.i-b.i);
        for(let left=100-out.reduce((a,b)=&gt;a+b,0),i=0;i&lt;left;i++)out[ordered[i].i]++;
        return out;
      };
      const dominant=w=&gt;{const max=Math.max(...moods.map(m=&gt;w[m.key]||0));return max&gt;0?moods.filter(m=&gt;w[m.key]===max):[];};
      const iconFor=w=&gt;{const ds=dominant(w);return ds.length===1?ds[0].icon:ds.length?&#x27;cloud-sun&#x27;:&#x27;minus&#x27;;};
      const moodNames=w=&gt;dominant(w).map(m=&gt;m.label).join(&#x27;・&#x27;)||&#x27;記録なし&#x27;;
      const icon=(name)=&gt;`&lt;i class=&quot;emlis-icon&quot; data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      const dot=m=&gt;`&lt;span class=&quot;mood-dot&quot; style=&quot;background:${m.color}&quot;&gt;&lt;/span&gt;`;
      const legend=(w,selected=false)=&gt;{const p=shares(w);return moods.map((m,i)=&gt;`&lt;div class=&quot;legend-entry&quot;&gt;${selected?`&lt;span class=&quot;mood-label&quot;&gt;${dot(m)}${m.label}&lt;/span&gt;`:`${dot(m)}&lt;span&gt;${m.label}&lt;/span&gt;`}&lt;span class=&quot;legend-value&quot;&gt;${p[i]}%&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);};
      function donut(w,size,center=&#x27;&#x27;){
        const total=sum(w);
        if(!total)return `&lt;div class=&quot;donut empty-donut&quot; style=&quot;width:${size}px;height:${size}px&quot; role=&quot;img&quot; aria-label=&quot;感情の記録なし&quot;&gt;&lt;span class=&quot;donut-center&quot;&gt;${icon(&#x27;minus&#x27;)}&lt;/span&gt;&lt;/div&gt;`;
        const r=44,c=2*Math.PI*r,gap=size&lt;80?1.2:2;let position=0;
        const circles=moods.map(m=&gt;{const amount=w[m.key]||0;if(!amount)return &#x27;&#x27;;const length=amount/total*c;const circle=`&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;${r}&quot; fill=&quot;none&quot; stroke=&quot;${m.color}&quot; stroke-width=&quot;10&quot; stroke-dasharray=&quot;${Math.max(0,length-gap)} ${c}&quot; stroke-dashoffset=&quot;${-position}&quot; transform=&quot;rotate(-90 50 50)&quot;/&gt;`;position+=length;return circle;}).join(&#x27;&#x27;);
        return `&lt;div class=&quot;donut&quot; style=&quot;width:${size}px;height:${size}px&quot; role=&quot;img&quot; aria-label=&quot;${moods.map((m,i)=&gt;m.label+shares(w)[i]+&#x27;パーセント&#x27;).join(&#x27;、&#x27;)}&quot;&gt;&lt;svg viewBox=&quot;0 0 100 100&quot; aria-hidden=&quot;true&quot;&gt;${circles}&lt;/svg&gt;&lt;div class=&quot;donut-center&quot;&gt;${center}&lt;/div&gt;&lt;/div&gt;`;
      }
      function timeBands(){return [{name:&#x27;深夜&#x27;,range:&#x27;0〜6時&#x27;,start:0,end:6},{name:&#x27;朝&#x27;,range:&#x27;6〜12時&#x27;,start:6,end:12},{name:&#x27;昼&#x27;,range:&#x27;12〜18時&#x27;,start:12,end:18},{name:&#x27;夜&#x27;,range:&#x27;18時〜いま&#x27;,start:18,end:24}].map(b=&gt;{const rows=records.filter(r=&gt;Number(r.time.slice(0,2))&gt;=b.start&amp;&amp;Number(r.time.slice(0,2))&lt;b.end);return {...b,rows,weights:weightsOf(rows)};});}
      function renderDay(){
        const d=days[TODAY],bands=timeBands(),band=bands[state.time];
        body.innerHTML=`&lt;section class=&quot;weather-card&quot;&gt;&lt;div class=&quot;card-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;今日の感情の割合&lt;/p&gt;&lt;h2&gt;夜は、平穏の割合が多め&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;weather-seal&quot;&gt;${icon(&#x27;cloud-sun&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;day-distribution&quot;&gt;${donut(d.weights,148,`&lt;span class=&quot;donut-number&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;donut-unit&quot;&gt;件の入力&lt;/span&gt;`)}&lt;div class=&quot;legend-vertical&quot;&gt;${legend(d.weights)}&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;description&quot;&gt;朝は不安、夜は平穏の割合が多く記録されています。複数の感情も、そのまま残っています。&lt;/p&gt;&lt;/section&gt;&lt;div class=&quot;subheading&quot;&gt;&lt;h3&gt;時間帯ごとの動き&lt;/h3&gt;&lt;span&gt;0時〜いま&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;time-grid&quot;&gt;${bands.map((b,i)=&gt;`&lt;button class=&quot;time-slot cursor-interaction&quot; type=&quot;button&quot; data-band=&quot;${i}&quot; aria-pressed=&quot;${i===state.time}&quot; aria-label=&quot;${b.name}、${b.range}、${b.rows.length}件の入力&quot;&gt;&lt;span class=&quot;time-title&quot;&gt;${b.name}&lt;/span&gt;&lt;span class=&quot;time-range&quot;&gt;${b.range}&lt;/span&gt;${donut(b.weights,43,icon(iconFor(b.weights)))}&lt;span class=&quot;time-dominant&quot;&gt;${moodNames(b.weights)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;section class=&quot;input-list&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;input-list-head&quot;&gt;&lt;h3&gt;${band.name}の入力&lt;/h3&gt;&lt;span&gt;${band.rows.length}件&lt;/span&gt;&lt;/div&gt;${band.rows.length?band.rows.map(r=&gt;`&lt;div class=&quot;input-row&quot;&gt;&lt;span class=&quot;input-time&quot;&gt;${r.time}&lt;/span&gt;&lt;div class=&quot;input-emotions&quot;&gt;${r.emotions.map(([key,strength])=&gt;{const m=moods.find(m=&gt;m.key===key);return `&lt;span&gt;${dot(m)}${m.label}・${[&#x27;&#x27;,&#x27;弱&#x27;,&#x27;中&#x27;,&#x27;強&#x27;][strength]}&lt;/span&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;empty-note&quot;&gt;この時間帯の入力はありません。&lt;/p&gt;&#x27;}&lt;/section&gt;&lt;p class=&quot;method-note&quot;&gt;割合には、選んだ感情の強さも反映しています。&lt;/p&gt;`;
        body.querySelectorAll(&#x27;[data-band]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{state.time=Number(button.dataset.band);renderDay();refreshIcons();}));
      }
      function periodDays(){
        if(state.mode===&#x27;week&#x27;){
          const monday=addDays(TODAY,-(new Date(TODAY+&#x27;T00:00:00Z&#x27;).getUTCDay()+6)%7);
          const first=addDays(monday,state.shifts.week*7);
          return Array.from({length:7},(_,i)=&gt;getDay(addDays(first,i))).filter(d=&gt;d.date&lt;=TODAY);
        }
        const [y,m]=TODAY.split(&#x27;-&#x27;).map(Number),start=new Date(Date.UTC(y,m-1+state.shifts.month,1));
        const first=start.toISOString().slice(0,10),last=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate();
        const count=state.shifts.month===0?Number(TODAY.slice(8)):last;
        return Array.from({length:count},(_,i)=&gt;getDay(addDays(first,i)));
      }
      function periodDescription(items){
        const mid=Math.ceil(items.length/2),a=dominant(aggregate(items.slice(0,mid))),b=dominant(aggregate(items.slice(mid)));
        const first=a.map(m=&gt;m.label).join(&#x27;・&#x27;),last=b.map(m=&gt;m.label).join(&#x27;・&#x27;);
        if(!first&amp;&amp;!last)return &#x27;この期間の感情入力はありません。&#x27;;
        if(first&amp;&amp;last&amp;&amp;first!==last)return `前半は${first}、後半は${last}の割合が多く記録されています。`;
        return `${last||first}の割合が多く記録されています。`;
      }
      function selectedHTML(items){
        const d=items.find(d=&gt;d.date===state.selected[state.mode])||items[items.length-1];
        if(!d)return &#x27;&#x27;;
        state.selected[state.mode]=d.date;
        return `&lt;section class=&quot;selected-day&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;selected-date&quot;&gt;${dateLabel(d.date)}&lt;span&gt;${d.count}件の入力&lt;/span&gt;&lt;/div&gt;${d.count?`&lt;div class=&quot;selected-composition&quot;&gt;${donut(d.weights,68,icon(iconFor(d.weights)))}&lt;div class=&quot;selected-legend&quot;&gt;${legend(d.weights,true)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&lt;p class=&quot;empty-note&quot;&gt;この日は感情の入力がありません。&lt;/p&gt;&#x27;}&lt;/section&gt;`;
      }
      function renderPeriod(){
        const items=periodDays(),count=items.reduce((s,d)=&gt;s+d.count,0),active=items.filter(d=&gt;d.count&gt;0).length;
        const type=state.mode===&#x27;week&#x27;?&#x27;この週&#x27;:&#x27;この月&#x27;;
        const title=count?&#x27;日ごとの、感情の移り変わり&#x27;:&#x27;まだ記録がありません&#x27;;
        const overall=aggregate(items);
        body.innerHTML=`&lt;section class=&quot;weather-card&quot;&gt;&lt;div class=&quot;card-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;${type}のこころ天気&lt;/p&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;div class=&quot;period-total&quot;&gt;${count}件の入力 · ${active}日分の記録&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;weather-seal&quot;&gt;${icon(iconFor(overall))}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;plot-legend&quot;&gt;${moods.map(m=&gt;`&lt;span class=&quot;legend-entry&quot;&gt;${dot(m)}${m.label}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${state.mode===&#x27;week&#x27;?`&lt;div class=&quot;weather-week&quot; aria-hidden=&quot;true&quot;&gt;${items.map(d=&gt;`&lt;span&gt;${icon(iconFor(d.weights))}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;plot-wrapper&quot;&gt;&lt;button class=&quot;plot-hit cursor-interaction&quot; type=&quot;button&quot; aria-label=&quot;日別の感情の割合。日をタップ、または左右の矢印キーで内訳を表示&quot;&gt;&lt;svg class=&quot;emotion-plot&quot; role=&quot;img&quot; aria-label=&quot;各日の感情の割合を色分けした積み上げ棒グラフ&quot;&gt;&lt;/svg&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;plot-help&quot;&gt;&lt;span&gt;日をタップすると内訳を表示&lt;/span&gt;&lt;span&gt;記録なしは空欄&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;description&quot;&gt;${periodDescription(items)}&lt;/p&gt;&lt;/section&gt;&lt;div id=&quot;emlis-selected-day&quot;&gt;${selectedHTML(items)}&lt;/div&gt;&lt;p class=&quot;method-note&quot;&gt;入力のある日を集計。割合には感情の強さも反映しています。${state.mode===&#x27;month&#x27;&amp;&amp;state.shifts.month===0?&#x27;&lt;br&gt;今月は、今日までの入力を表示しています。&#x27;:&#x27;&#x27;}&lt;/p&gt;`;
        const hit=body.querySelector(&#x27;.plot-hit&#x27;);
