&lt;script&gt;
(() =&gt; {

  const dayData=[

  };
  const toastTimers = new WeakMap();
  let sizing = false;

  function iconRefresh(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:20,height:20}});}
  function announce(message){root.querySelector(&#x27;[data-announcement]&#x27;).textContent=message;}
  function equalize(){
    if(sizing)return;
    sizing=true;
    const width=root.clientWidth;
    let max=0;
    phones.forEach(phone=&gt;{
      const section=phone.closest(&#x27;[data-variant]&#x27;);
      const wasHidden=section.hidden;
      const old=section.getAttribute(&#x27;style&#x27;);

      if(old===null)section.removeAttribute(&#x27;style&#x27;);else section.setAttribute(&#x27;style&#x27;,old);
      section.hidden=wasHidden;

    root.style.setProperty(&#x27;--c-stage-height&#x27;,Math.ceil(max)+&#x27;px&#x27;);
    sizing=false;
  }
  function sync(){
    root.querySelectorAll(&#x27;[data-preview-view]&#x27;).forEach(b=&gt;{
      const selected=b.dataset.previewView===state.view;
      b.setAttribute(&#x27;aria-pressed&#x27;,String(selected));b.classList.toggle(&#x27;btn-primary&#x27;,selected);
    });
    phones.forEach(phone=&gt;{
      phone.querySelectorAll(&#x27;[data-app-view]&#x27;).forEach(v=&gt;v.hidden=v.dataset.appView!==state.view);
      phone.querySelectorAll(&#x27;[data-emotion]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.emotion===state.emotion)));
      phone.querySelector(&#x27;[data-feeling-name]&#x27;).textContent=state.emotion;
      phone.querySelector(&#x27;.c-intensity&#x27;).hidden=state.emotion===&#x27;自己理解&#x27;;
      phone.querySelectorAll(&#x27;[data-intensity]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.intensity===state.intensity)));
      phone.querySelectorAll(&#x27;[data-category]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(state.categories.has(b.dataset.category))));
      phone.querySelectorAll(&#x27;[data-palette]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.palette===state.palette)));
      phone.querySelectorAll(&#x27;[data-ratio]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.ratio===state.ratio)));
      phone.querySelectorAll(&#x27;[data-field]&#x27;).forEach(f=&gt;{

      });
      phone.querySelector(&#x27;[data-theme-label]&#x27;).textContent=paletteNames[state.palette];
      phone.querySelector(&#x27;[data-ratio-caption]&#x27;).textContent=state.ratio;
      const art=phone.querySelector(&#x27;[data-artwork]&#x27;);
      art.className=&#x27;c-artwork c-palette-&#x27;+state.palette;
      art.style.aspectRatio=state.ratio===&#x27;4:5&#x27;?&#x27;4 / 5&#x27;:&#x27;9 / 16&#x27;;
      phone.querySelector(&#x27;[data-artwork-brand]&#x27;).style.visibility=state.logo?&#x27;visible&#x27;:&#x27;hidden&#x27;;
      phone.querySelector(&#x27;[data-piece-action]&#x27;).textContent=state.action;
      phone.querySelector(&#x27;[data-piece-thought]&#x27;).textContent=state.thought;
      phone.dataset.preferenceTheme=state.appTheme;
      phone.querySelectorAll(&#x27;.c-bottom-nav button&#x27;).forEach(b=&gt;{
        const viewForAction={home:&#x27;home&#x27;,&#x27;nav-analysis&#x27;:&#x27;analysis&#x27;,&#x27;nav-piece&#x27;:&#x27;piece&#x27;,&#x27;nav-settings&#x27;:&#x27;settings&#x27;};

      });
      phone.querySelectorAll(&#x27;[data-analysis-mode]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.analysisMode===state.analysisMode)));
      phone.querySelectorAll(&#x27;[data-analysis-panel]&#x27;).forEach(p=&gt;p.hidden=p.dataset.analysisPanel!==state.analysisMode);
      phone.querySelectorAll(&#x27;[data-period]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.period===state.period)));
      const weather=weatherData[state.period];
      const total=weather.counts.reduce((a,b)=&gt;a+b,0);
      phone.querySelector(&#x27;[data-weather-range]&#x27;).textContent=weather.range;
      phone.querySelector(&#x27;[data-weather-eyebrow]&#x27;).textContent=weather.eyebrow;
      phone.querySelector(&#x27;[data-weather-title]&#x27;).textContent=weather.title;
      phone.querySelector(&#x27;[data-weather-copy]&#x27;).textContent=weather.copy;
      phone.querySelector(&#x27;[data-record-count]&#x27;).textContent=String(total);
      const legend=phone.querySelector(&#x27;[data-mood-legend]&#x27;);
      legend.replaceChildren();
      let cumulative=0;
      const stops=[];
      moodData.forEach((m,index)=&gt;{
        const row=document.createElement(&#x27;div&#x27;);
        const dot=document.createElement(&#x27;span&#x27;);dot.className=&#x27;c-mood-dot c-dot-&#x27;+m.key;
        const count=document.createElement(&#x27;strong&#x27;);count.textContent=String(weather.counts[index]);
        row.append(dot,document.createTextNode(m.name),count);legend.append(row);
        const start=cumulative; cumulative+=weather.counts[index]/total*100;
        stops.push(&#x27;var(--c-mood-&#x27;+m.key+&#x27;) &#x27;+start+&#x27;% &#x27;+cumulative+&#x27;%&#x27;);
      });
      const ring=phone.querySelector(&#x27;[data-mood-ring]&#x27;);
      ring.style.background=&#x27;conic-gradient(&#x27;+stops.join(&#x27;,&#x27;)+&#x27;)&#x27;;
      ring.setAttribute(&#x27;aria-label&#x27;,String(total)+&#x27;件の記録：&#x27;+moodData.map((m,i)=&gt;m.name+weather.counts[i]+&#x27;件&#x27;).join(&#x27;、&#x27;));
      phone.querySelector(&#x27;[data-week-section]&#x27;).hidden=state.period!==&#x27;week&#x27;;
      phone.querySelectorAll(&#x27;[data-day]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(Number(b.dataset.day)===state.day)));
      const record=dayData[state.period===&#x27;day&#x27;?5:state.day];
      phone.querySelector(&#x27;[data-memory-date]&#x27;).textContent=record.label;
      phone.querySelector(&#x27;[data-memory-text]&#x27;).textContent=record.text;
      phone.querySelector(&#x27;[data-record-heading]&#x27;).textContent=record.date+&#x27;の記録&#x27;;
      phone.querySelector(&#x27;[data-record-body]&#x27;).textContent=record.body;
      phone.querySelector(&#x27;[data-weather-record]&#x27;).hidden=!state.weatherRecord;
      phone.querySelector(&#x27;[data-evidence-panel]&#x27;).hidden=!state.mapEvidence;
      phone.querySelector(&#x27;[data-evidence-text]&#x27;).textContent=evidenceTexts[state.mapEvidence]||&#x27;&#x27;;
      phone.querySelectorAll(&#x27;[data-evidence]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-expanded&#x27;,String(state.mapEvidence===b.dataset.evidence)));
      phone.querySelector(&#x27;[data-map-compare]&#x27;).hidden=!state.mapCompare;
      phone.querySelectorAll(&#x27;[data-settings-panel]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-expanded&#x27;,String(state.settingsPanel===b.dataset.settingsPanel)));
      phone.querySelectorAll(&#x27;[data-setting-content]&#x27;).forEach(p=&gt;p.hidden=p.dataset.settingContent!==state.settingsPanel);
      phone.querySelectorAll(&#x27;[data-app-theme]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(state.appTheme===b.dataset.appTheme)));

  function setView(view){
    state.view=view;
    phones.forEach(p=&gt;{p.querySelector(&#x27;[data-modal-layer]&#x27;).hidden=true;p.querySelector(&#x27;[data-toast]&#x27;).hidden=true;p.querySelectorAll(&#x27;[data-app-view]&#x27;).forEach(v=&gt;v.inert=false);});
    const viewNames={home:&#x27;ホーム&#x27;,piece:&#x27;Pieceのプレビュー&#x27;,analysis:&#x27;分析&#x27;,settings:&#x27;設定&#x27;};

  root.addEventListener(&#x27;input&#x27;,event=&gt;{
    const notification=event.target.closest(&#x27;[data-setting-notification]&#x27;);

  root.addEventListener(&#x27;click&#x27;,event=&gt;{

      if(state.categories.has(c))state.categories.delete(c);else state.categories.add(c);

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
