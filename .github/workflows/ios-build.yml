name: iOS TestFlight Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS archive
        run: |
          xcodebuild \
            -workspace ios/Cocolon.xcworkspace \
            -scheme Cocolon \
            -configuration Release \
            -archivePath build/Cocolon.xcarchive \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/Cocolon.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build

      - name: Upload to TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file build/Cocolon.ipa \
            --username "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}"
