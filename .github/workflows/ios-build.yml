name: iOS TestFlight Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    env:
      RCT_NEW_ARCH_ENABLED: "0"
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcode-select -p

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Patch slider header import (Bridge -> React)
        run: |
          set -euo pipefail

          FILE="node_modules/@react-native-community/slider/ios/RNCSliderComponentView.h"

          if [ -f "$FILE" ]; then
            echo "Patching: $FILE"
            # Fix: fatal error: 'Bridge/RCTBridgeModule.h' file not found
            sed -i '' 's|<Bridge/RCTBridgeModule.h>|<React/RCTBridgeModule.h>|g' "$FILE"
            echo "After patch:"
            grep -n "RCTBridgeModule.h" "$FILE" || true

            # Fix: fatal error: 'React/RCTViewComponentView.h' file not found
            # When New Architecture is disabled (RCT_NEW_ARCH_ENABLED != 1),
            # remove Fabric ComponentView sources for slider so CocoaPods won't compile them.
            if [ "${RCT_NEW_ARCH_ENABLED:-0}" != "1" ]; then
              SLIDER_DIR="node_modules/@react-native-community/slider"
              if [ -d "$SLIDER_DIR" ]; then
                echo "RCT_NEW_ARCH_ENABLED=${RCT_NEW_ARCH_ENABLED:-0} -> removing Fabric ComponentView sources for slider"
                find "$SLIDER_DIR" -name "RNCSliderComponentView.*" -print -exec rm -f {} + || true
              else
                echo "Slider dir not found: $SLIDER_DIR"
              fi
            fi
          else
            echo "File not found: $FILE"
            # Fallback search (non-fatal)
            find node_modules -maxdepth 6 -name "RNCSliderComponentView.h" -print || true
          fi

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock') }}

      - name: Install CocoaPods
        working-directory: ios
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -euo pipefail

          # Prefer the system git for CocoaPods source downloads on GitHub Actions.
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:$PATH"
          echo "Using git: $(which git)"
          git --version
          pod --version

          # Important: do not reuse a cached Pods directory when switching away from
          # use_modular_headers! to use_frameworks! :linkage => :static. Recreate Pods
          # from Podfile.lock so stale generated modulemaps cannot survive between runs.
          rm -rf Pods
          pod deintegrate || true

          retry() {
            local max_attempts="$1"
            shift
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${attempt} attempt(s): $*"
                return 1
              fi

              echo "Attempt ${attempt} failed. Cleaning CocoaPods caches and retrying..."
              pod cache clean --all || true
              rm -rf Pods ~/Library/Caches/CocoaPods || true
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          retry 3 pod install --repo-update --verbose

      # --- Code Signing (required for Archive / TestFlight) ---
      # Required Secrets:
      #   IOS_P12_BASE64              : base64 of Apple Distribution .p12
      #   IOS_P12_PASSWORD            : password you set when exporting .p12
      #   IOS_PROFILE_BASE64          : base64 of App Store provisioning profile (.mobileprovision)
      #   IOS_KEYCHAIN_PASSWORD       : any random string
      #   IOS_TEAM_ID                 : Team ID (e.g. 7AZ5LHFZ44)
      #   IOS_BUNDLE_ID               : Bundle ID in App Store Connect (must match)
      # Existing Secrets (already created by you):
      #   APPLE_ID, APPLE_APP_PASSWORD
      - name: Install signing certificate & provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail

          # 1) Create & unlock keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # 2) Import Apple Distribution cert (.p12)
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_P12_BASE64" | base64 -D > "$CERT_PATH"
          security import "$CERT_PATH" -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # 3) Install provisioning profile (.mobileprovision)
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          echo "PROFILE_PATH=$PROFILE_PATH"
          ls -l "$PROFILE_PATH"
          echo "PROFILE size: $(wc -c < "$PROFILE_PATH")"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")

          echo "PROFILE_UUID=$UUID"
          echo "PROFILE_NAME=$PROFILE_NAME"

          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_APS_ENVIRONMENT=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)

          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID"
          echo "PROFILE_APP_IDENTIFIER=$PROFILE_APP_IDENTIFIER"
          echo "PROFILE_APS_ENVIRONMENT=${PROFILE_APS_ENVIRONMENT:-<missing>}"

          echo "Installed signing identities:"
          security find-identity -v -p codesigning build.keychain || true

          if ! security find-identity -v -p codesigning build.keychain | grep -q "Apple Distribution"; then
            echo "::error::Apple Distribution certificate was not imported into build.keychain"
            exit 1
          fi

          if [ -n "${IOS_TEAM_ID:-}" ] && [ "$PROFILE_TEAM_ID" != "$IOS_TEAM_ID" ]; then
            echo "::error::Provisioning profile team ID ($PROFILE_TEAM_ID) does not match IOS_TEAM_ID ($IOS_TEAM_ID)"
            exit 1
          fi

          if [ -n "${IOS_BUNDLE_ID:-}" ]; then
            EXPECTED_APP_ID="${PROFILE_TEAM_ID}.${IOS_BUNDLE_ID}"
            if [ "$PROFILE_APP_IDENTIFIER" != "$EXPECTED_APP_ID" ] && [ "$PROFILE_APP_IDENTIFIER" != "${PROFILE_TEAM_ID}.*" ]; then
              echo "::error::Provisioning profile application-identifier ($PROFILE_APP_IDENTIFIER) does not match IOS_BUNDLE_ID ($IOS_BUNDLE_ID)"
              exit 1
            fi
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          # Expose to next steps
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"


      - name: Set build number (CFBundleVersion) for TestFlight
        working-directory: ios
        run: |
          set -euo pipefail

          # App Store Connect requires CFBundleVersion (build number) to be unique
          # and higher than the previously uploaded build for the same version.
          # Use a monotonically increasing number that also changes on re-runs.
          RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + RUN_ATTEMPT))

          echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build iOS archive
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail

          mkdir -p build
          LOG_PATH="$PWD/build/xcodebuild-archive.log"

          # Do not pass signing build settings such as PROVISIONING_PROFILE_SPECIFIER
          # directly on the xcodebuild command line. Command-line build settings apply
          # to every target in the workspace, including Pods, which causes errors like
          # "Pods-*.xcodeproj: <target> does not support provisioning profiles".
          # Instead, the app target's Release build settings reference APP_* variables,
          # and we only override those custom variables here.
          status=0
          xcodebuild \
            -workspace tempCocolon.xcworkspace \
            -scheme tempCocolon \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Cocolon.xcarchive \
            archive \
            APP_DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            APP_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            APP_CODE_SIGN_STYLE=Manual \
            APP_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            APP_CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_KEY_CFBundleVersion="$BUILD_NUMBER" \
            IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault \
            2>&1 | tee "$LOG_PATH" || status=$?

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "===== Extracted archive failure lines ====="
            grep -nE "error:|CodeSign|codesign|Provisioning profile|No profiles|requires a development team|bundle identifier|application-identifier|entitlements|ARCHIVE FAILED|PhaseScriptExecution|Command PhaseScriptExecution failed" "$LOG_PATH" | tail -n 200 || true
            echo "===== End extracted archive failure lines ====="
            exit "$status"
          fi

      - name: Create ExportOptions.plist
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail

          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Clear dict" "$EXPORT_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_NAME" "$EXPORT_PLIST"

          echo "EXPORT_PLIST=$EXPORT_PLIST" >> "$GITHUB_ENV"

      - name: Export IPA
        working-directory: ios
        run: |
          set -euo pipefail

          xcodebuild             -exportArchive             -archivePath build/Cocolon.xcarchive             -exportOptionsPlist "$EXPORT_PLIST"             -exportPath build

      - name: Upload to TestFlight
        working-directory: ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          IPA_PATH="$(ls -1 build/*.ipa | head -n 1)"
          echo "IPA_PATH=$IPA_PATH"

          xcrun altool             --upload-app             --type ios             --file "$IPA_PATH"             --username "$APPLE_ID"             --password "$APPLE_APP_PASSWORD"
