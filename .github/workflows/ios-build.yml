name: iOS TestFlight Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      RCT_NEW_ARCH_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install native libraries for canvas
        run: |
          set -euo pipefail
          brew install pkg-config cairo pango libpng jpeg giflib librsvg pixman

          BREW_PREFIX="$(brew --prefix)"
          echo "BREW_PREFIX=$BREW_PREFIX"
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/libpng/lib/pkgconfig:$BREW_PREFIX/opt/jpeg/lib/pkgconfig:$BREW_PREFIX/opt/cairo/lib/pkgconfig:$BREW_PREFIX/opt/pango/lib/pkgconfig:$BREW_PREFIX/opt/librsvg/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$BREW_PREFIX/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$BREW_PREFIX/include" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Patch slider header import (Bridge -> React)
        run: |
          set -euo pipefail

          FILE="node_modules/@react-native-community/slider/ios/RNCSliderComponentView.h"

          if [ -f "$FILE" ]; then
            echo "Patching: $FILE"
            # Fix: fatal error: 'Bridge/RCTBridgeModule.h' file not found
            sed -i '' 's|<Bridge/RCTBridgeModule.h>|<React/RCTBridgeModule.h>|g' "$FILE"
            echo "After patch:"
            grep -n "RCTBridgeModule.h" "$FILE" || true

            # Fix: fatal error: 'React/RCTViewComponentView.h' file not found
            # When New Architecture is disabled (RCT_NEW_ARCH_ENABLED != 1),
            # remove Fabric ComponentView sources for slider so CocoaPods won't compile them.
            if [ "${RCT_NEW_ARCH_ENABLED:-0}" != "1" ]; then
              SLIDER_DIR="node_modules/@react-native-community/slider"
              if [ -d "$SLIDER_DIR" ]; then
                echo "RCT_NEW_ARCH_ENABLED=${RCT_NEW_ARCH_ENABLED:-0} -> removing Fabric ComponentView sources for slider"
                find "$SLIDER_DIR" -name "RNCSliderComponentView.*" -print -exec rm -f {} + || true
              else
                echo "Slider dir not found: $SLIDER_DIR"
              fi
            fi
          else
            echo "File not found: $FILE"
            # Fallback search (non-fatal)
            find node_modules -maxdepth 6 -name "RNCSliderComponentView.h" -print || true
          fi

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Install signing certificate & provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          CERT_PATH="$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_P12_BASE64" | base64 -D > "$CERT_PATH"
          security import "$CERT_PATH" -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          echo "PROFILE_PATH=$PROFILE_PATH"
          ls -l "$PROFILE_PATH"
          echo "PROFILE size: $(wc -c < "$PROFILE_PATH")"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")

          echo "PROFILE_UUID=$UUID"
          echo "PROFILE_NAME=$PROFILE_NAME"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Set build number (CFBundleVersion) for TestFlight
        working-directory: ios
        run: |
          set -euo pipefail
          RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + RUN_ATTEMPT))

          echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build iOS archive
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace tempCocolon.xcworkspace \
            -scheme tempCocolon \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Cocolon.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_KEY_CFBundleVersion="$BUILD_NUMBER"

      - name: Create ExportOptions.plist
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail

          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Clear dict" "$EXPORT_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_NAME" "$EXPORT_PLIST"

          echo "EXPORT_PLIST=$EXPORT_PLIST" >> "$GITHUB_ENV"

      - name: Export IPA
        working-directory: ios
        run: |
          set -euo pipefail

          xcodebuild \
            -exportArchive \
            -archivePath build/Cocolon.xcarchive \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath build

      - name: Upload to TestFlight
        working-directory: ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          IPA_PATH="$(ls -1 build/*.ipa | head -n 1)"
          echo "IPA_PATH=$IPA_PATH"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD"
