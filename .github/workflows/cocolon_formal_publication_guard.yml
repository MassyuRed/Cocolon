name: cocolon-formal-publication-guardian

on:
  issues:
    types:
      - opened

permissions: {}

concurrency:
  group: cocolon-formal-publication-guardian-main-v1
  queue: max

jobs:
  preflight:
    if: >-
      ${{
        github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        github.event.repository.id == 1163713768 &&
        startsWith(
          github.event.issue.title,
          'COCOLON_FORMAL_PUBLICATION_REQUEST_V1 '
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.guard.outputs.outcome }}
      postverified: ${{ steps.guard.outputs.postverified }}
      target_class: ${{ steps.guard.outputs.target_class }}
      write_attempted: ${{ steps.guard.outputs.write_attempted }}
      request_sha256: ${{ steps.guard.outputs.request_sha256 }}
      candidate_sha1: ${{ steps.guard.outputs.candidate_sha1 }}
      observed_before: ${{ steps.guard.outputs.observed_before }}
      observed_after: ${{ steps.guard.outputs.observed_after }}
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Read-only preflight
        id: guard
        env:
          GUARDIAN_EVENT_PATH: ${{ github.event_path }}
        run: python .github/cocolon_formal_publication_guard/guardian.py preflight

  publish-sandbox:
    needs: preflight
    if: >-
      ${{
        needs.preflight.result == 'success' &&
        needs.preflight.outputs.outcome == 'PREFLIGHT_PASSED' &&
        needs.preflight.outputs.target_class == 'sandbox'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      outcome: ${{ steps.guard.outputs.outcome }}
      postverified: ${{ steps.guard.outputs.postverified }}
      write_attempted: ${{ steps.guard.outputs.write_attempted }}
      request_sha256: ${{ steps.guard.outputs.request_sha256 }}
      candidate_sha1: ${{ steps.guard.outputs.candidate_sha1 }}
      observed_before: ${{ steps.guard.outputs.observed_before }}
      observed_after: ${{ steps.guard.outputs.observed_after }}
      failure_stage: ${{ steps.guard.outputs.failure_stage }}
      git_failure_kind: ${{ steps.guard.outputs.git_failure_kind }}
      git_stderr_hint: ${{ steps.guard.outputs.git_stderr_hint }}
      result_uncertain: ${{ steps.guard.outputs.result_uncertain }}
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Publish sandbox with exact lease
        id: guard
        env:
          GUARDIAN_EVENT_PATH: ${{ github.event_path }}
        run: >-
          python .github/cocolon_formal_publication_guard/guardian.py publish
          --expected-target-class sandbox

  publish-main:
    needs: preflight
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      outcome: ${{ steps.guard.outputs.outcome }}
      postverified: ${{ steps.guard.outputs.postverified }}
      write_attempted: ${{ steps.guard.outputs.write_attempted }}
      request_sha256: ${{ steps.guard.outputs.request_sha256 }}
      candidate_sha1: ${{ steps.guard.outputs.candidate_sha1 }}
      observed_before: ${{ steps.guard.outputs.observed_before }}
      observed_after: ${{ steps.guard.outputs.observed_after }}
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Publish main with exact lease
        id: guard
        env:
          GUARDIAN_EVENT_PATH: ${{ github.event_path }}
        run: >-
          python .github/cocolon_formal_publication_guard/guardian.py publish
          --expected-target-class production

  report:
    needs:
      - preflight
      - publish-sandbox
      - publish-main
    if: >-
      ${{
        always() &&
        github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        github.event.repository.id == 1163713768 &&
        startsWith(
          github.event.issue.title,
          'COCOLON_FORMAL_PUBLICATION_REQUEST_V1 '
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Reconcile and report
        env:
          GH_TOKEN: ${{ github.token }}
          GUARDIAN_EVENT_PATH: ${{ github.event_path }}
          GUARDIAN_PREFLIGHT_CANDIDATE_SHA1: ${{ needs.preflight.outputs.candidate_sha1 }}
          GUARDIAN_PREFLIGHT_JOB_RESULT: ${{ needs.preflight.result }}
          GUARDIAN_PREFLIGHT_OBSERVED_AFTER: ${{ needs.preflight.outputs.observed_after }}
          GUARDIAN_PREFLIGHT_OBSERVED_BEFORE: ${{ needs.preflight.outputs.observed_before }}
          GUARDIAN_PREFLIGHT_OUTCOME: ${{ needs.preflight.outputs.outcome }}
          GUARDIAN_PREFLIGHT_POSTVERIFIED: ${{ needs.preflight.outputs.postverified }}
          GUARDIAN_PREFLIGHT_REQUEST_SHA256: ${{ needs.preflight.outputs.request_sha256 }}
          GUARDIAN_PREFLIGHT_WRITE_ATTEMPTED: ${{ needs.preflight.outputs.write_attempted }}
          GUARDIAN_MAIN_CANDIDATE_SHA1: ${{ needs.publish-main.outputs.candidate_sha1 }}
          GUARDIAN_MAIN_JOB_RESULT: ${{ needs.publish-main.result }}
          GUARDIAN_MAIN_OBSERVED_AFTER: ${{ needs.publish-main.outputs.observed_after }}
          GUARDIAN_MAIN_OBSERVED_BEFORE: ${{ needs.publish-main.outputs.observed_before }}
          GUARDIAN_MAIN_OUTCOME: ${{ needs.publish-main.outputs.outcome }}
          GUARDIAN_MAIN_POSTVERIFIED: ${{ needs.publish-main.outputs.postverified }}
          GUARDIAN_MAIN_REQUEST_SHA256: ${{ needs.publish-main.outputs.request_sha256 }}
          GUARDIAN_MAIN_WRITE_ATTEMPTED: ${{ needs.publish-main.outputs.write_attempted }}
          GUARDIAN_SANDBOX_CANDIDATE_SHA1: ${{ needs.publish-sandbox.outputs.candidate_sha1 }}
          GUARDIAN_SANDBOX_FAILURE_STAGE: ${{ needs.publish-sandbox.outputs.failure_stage }}
          GUARDIAN_SANDBOX_GIT_FAILURE_KIND: ${{ needs.publish-sandbox.outputs.git_failure_kind }}
          GUARDIAN_SANDBOX_GIT_STDERR_HINT: ${{ needs.publish-sandbox.outputs.git_stderr_hint }}
          GUARDIAN_SANDBOX_JOB_RESULT: ${{ needs.publish-sandbox.result }}
          GUARDIAN_SANDBOX_OBSERVED_AFTER: ${{ needs.publish-sandbox.outputs.observed_after }}
          GUARDIAN_SANDBOX_OBSERVED_BEFORE: ${{ needs.publish-sandbox.outputs.observed_before }}
          GUARDIAN_SANDBOX_OUTCOME: ${{ needs.publish-sandbox.outputs.outcome }}
          GUARDIAN_SANDBOX_POSTVERIFIED: ${{ needs.publish-sandbox.outputs.postverified }}
          GUARDIAN_SANDBOX_REQUEST_SHA256: ${{ needs.publish-sandbox.outputs.request_sha256 }}
          GUARDIAN_SANDBOX_RESULT_UNCERTAIN: ${{ needs.publish-sandbox.outputs.result_uncertain }}
          GUARDIAN_SANDBOX_WRITE_ATTEMPTED: ${{ needs.publish-sandbox.outputs.write_attempted }}
        run: python .github/cocolon_formal_publication_guard/guardian.py report
