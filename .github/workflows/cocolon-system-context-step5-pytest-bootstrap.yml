name: Cocolon System Context Step 5 workflow concurrency bootstrap
run-name: Separate Step 5 workflow events @ ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-step5-pytest-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step5-concurrency-bootstrap
  cancel-in-progress: false

jobs:
  patch-standard-workflow:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      STANDARD_WORKFLOW: .github/workflows/cocolon-system-context-inventory.yml
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Separate push and pull-request concurrency groups
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cocolon-system-context-inventory.yml')
          text = path.read_text(encoding='utf-8')
          head_ref = '$' + '{{ github.event.pull_request.head.ref || github.ref_name }}'
          event_name = '$' + '{{ github.event_name }}'
          old = f'  group: cocolon-system-context-step5-{head_ref}\n'
          new = f'  group: cocolon-system-context-step5-{event_name}-{head_ref}\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('standard workflow concurrency anchor is missing')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          if new not in path.read_text(encoding='utf-8'):
              raise SystemExit('standard workflow concurrency correction was not written')
          PY
          grep -F 'python3 -m pip install --disable-pip-version-check pytest==8.4.2' "$STANDARD_WORKFLOW"
          git diff --check -- "$STANDARD_WORKFLOW"
          git add -- "$STANDARD_WORKFLOW"
          test -n "$(git diff --cached --name-only -- "$STANDARD_WORKFLOW")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(system-context): separate Step 5 workflow event concurrency"
          PATCHED_COMMIT="$(git rev-parse HEAD)"
          echo "PATCHED_COMMIT=${PATCHED_COMMIT}"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$SOURCE_COMMIT"
          git push origin "HEAD:${TARGET_BRANCH}"
