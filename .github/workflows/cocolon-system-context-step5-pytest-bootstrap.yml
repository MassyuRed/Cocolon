name: Cocolon System Context fresh-head pytest verifier
run-name: Verify pytest at exact Draft head @ ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .devcontainer/**
      - .github/context-payloads/**
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/workflows/cocolon-system-context-step5-export.yml
      - .github/workflows/cocolon-system-context-step5-pytest-bootstrap.yml
      - .gitignore
      - tools/cocolon_context*
      - Cocolon_前提資料/system_context/00_read_first.md
      - Cocolon_前提資料/system_context/workspace_profiles.json
      - Cocolon_前提資料/system_context/task_profiles.json
      - tests/cocolon_context/**
      - Cocolon_前提資料/system_context/Cocolon_SystemContext_ImplementationContract_20260818.md
      - Cocolon_前提資料/system_context/current/cmee_working/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest-current-draft-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_ROLE: PYTEST_RUNTIME_VERIFIER
    steps:
      - name: Require same-repository PR event
        env:
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKFLOW_ROLE" = "PYTEST_RUNTIME_VERIFIER"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$EVENT_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$EVENT_BASE_REPOSITORY" = "$GITHUB_REPOSITORY"

      - name: Bind to current open Draft PR head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR_NUMBER}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_HEAD_SHA" --arg ref "$EXPECTED_HEAD_REF" '
            .state == "open" and .draft == true and .merged == false
            and .head.repo.full_name == $repo and .base.repo.full_name == $repo
            and .head.sha == $sha and .head.ref == $ref
          ' <<<"$PR_JSON" >/dev/null

      - name: Checkout exact PR head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert local checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Build fixed System Context environment
        shell: bash
        run: docker build --file .devcontainer/Dockerfile --tag cocolon-system-context-ci .devcontainer

      - name: Run terminal Step 7 pytest set in fixed read-only environment
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none \
            --tmpfs /tmp:rw,nosuid,nodev \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env PYTHONPYCACHEPREFIX=/tmp/pycache \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            cocolon-system-context-ci \
            bash -euo pipefail -c '
          python3 -m tools.cocolon_context doctor
          python3 -m py_compile \
            tools/cocolon_context.py \
            tools/cocolon_context_environment.py \
            tools/cocolon_context_prepare.py \
            tools/cocolon_context_task.py \
            tools/cocolon_context_publish_transport.py
          python3 -m pytest -p no:cacheprovider tests/cocolon_context/test_prepare.py tests/cocolon_context/test_task_context.py -q
            '

      - name: Assert no tracked mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Recheck current PR head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR_NUMBER}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_HEAD_SHA" --arg ref "$EXPECTED_HEAD_REF" '
            .state == "open" and .draft == true and .merged == false
            and .head.repo.full_name == $repo and .base.repo.full_name == $repo
            and .head.sha == $sha and .head.ref == $ref
          ' <<<"$PR_JSON" >/dev/null
