name: Materialize original Piece and Analysis sources once

on:
  push:
    branches:
      - agent/three-core-cmee-current-structure-20260815
    paths:
      - .github/workflows/materialize_original_assets_once.yml

permissions:
  contents: write

concurrency:
  group: materialize-original-assets-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/three-core-cmee-current-structure-20260815

      - name: Reconstruct and verify original files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import bz2
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          chunk_root = Path('.github/materialize_original_assets')
          workflow_path = Path('.github/workflows/materialize_original_assets_once.yml')

          chunks = [
              ('original_assets.tar.bz2.b64.part00', 10000, '92c2dfc65cb5bc8e29bc4957220f7fa397d16d01f199c3cc1e0de3dcf7b8d0df'),
              ('original_assets.tar.bz2.b64.part01', 10000, '333d13cb979ded44eb4b9b18882553c6cd05432ae3d4d2af82d7f0244f24804e'),
              ('original_assets.tar.bz2.b64.part02', 10000, 'a20ff2d87c55bd61b96f2a8f042b44dc1f3a46946b264f04f2857b8d3fb16470'),
              ('original_assets.tar.bz2.b64.part03', 10000, '6286d1eb265b43aa4c43bf02f08af5ac39770dcf5f8c64a9ea3f4fc298d5013f'),
              ('original_assets.tar.bz2.b64.part04', 10000, '81757b70ffa1d5a4bd80cc14e28db3bdb88a83a452d6804c4ca8870ea09d67dd'),
              ('original_assets.tar.bz2.b64.part05a', 2500, '4f7e8c296c52f9d807778b09f0ca2339714590e207deaf9363dacc96c8d5674e'),
              ('original_assets.tar.bz2.b64.part05b', 2500, '2da12215a3fd536e8ade97fda0c9987831dee39cf07ab7cf08b827a16e52a2c7'),
              ('original_assets.tar.bz2.b64.part05c', 2500, 'a5d951af911e60b69a8d2ebe9602920160c8dac00142259712296187b2ca2d9d'),
              ('original_assets.tar.bz2.b64.part05d', 2500, '98c7faaf2a7920a6345992c44b374f2ef814023313547e3c954ddfcc0ee98d1c'),
              ('original_assets.tar.bz2.b64.part06', 212, '7cbe191af9f42e6cc600d2b51f02fdd631c666f2f62c1a71bc1c7c4633e213e5'),
          ]

          encoded_parts: list[bytes] = []
          for name, expected_size, expected_sha256 in chunks:
              path = chunk_root / name
              data = path.read_bytes()
              actual_sha256 = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size or actual_sha256 != expected_sha256:
                  raise SystemExit(
                      f'chunk mismatch: {name} size={len(data)} sha256={actual_sha256}'
                  )
              encoded_parts.append(data)

          encoded = b''.join(encoded_parts)
          archive = base64.b64decode(encoded, validate=True)
          archive_sha256 = hashlib.sha256(archive).hexdigest()
          expected_archive_sha256 = 'cb5e65111f4ba6ffee0939529332e219f65f8e0babfaad55ff4bdcb3c91f9203'
          if archive_sha256 != expected_archive_sha256:
              raise SystemExit(f'archive mismatch: {archive_sha256}')

          tar_bytes = bz2.decompress(archive)
          expected_files = {
              'Cocolon_Piece/design_sources/Cocolon_Piece_Card_Image_Export_Redesign_DesignNote_20260707.md': '2fb57d864ff911b3cb78e1de35f1924494a5aa67b104e9578baa1e131dcd7948',
              'Cocolon_Piece/roadmap/Cocolon_Piece_ProFirst_ChatWork_Roadmap_20260807_CleanCutover_Revised.md': '2eb8d7b4b58ef5fa21f2643ca381f8efb3bfdf08bde29432e746972f7d4f6939',
              'Cocolon_Analysis/roadmap/Cocolon_Analysis_ProFirst_CurrentActual_ProductQualityClosure_Roadmap_20260807.md': '633190b8685143aaca8215c35a876017b32fd00393e42ee94a81a6eb561bd5ba',
              'Cocolon_Analysis/simulation/Cocolon_WatashiSimulation_RouteBranch_DesignNote_20260708.md': '9803dc00eb319e9da52d3f4fd6550dff6b717675ec5169e0e2fab29e084469ce',
          }

          extracted: dict[str, bytes] = {}
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tf:
              members = tf.getmembers()
              names = [member.name for member in members]
              if set(names) != set(expected_files) or len(names) != len(expected_files):
                  raise SystemExit(f'unexpected archive members: {names!r}')

              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name!r}')
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read archive member: {member.name!r}')
                  data = source.read()
                  actual_sha256 = hashlib.sha256(data).hexdigest()
                  if actual_sha256 != expected_files[member.name]:
                      raise SystemExit(
                          f'file mismatch: {member.name} sha256={actual_sha256}'
                      )
                  extracted[member.name] = data

          for name, data in extracted.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          for name, expected_sha256 in expected_files.items():
              data = Path(name).read_bytes()
              actual_sha256 = hashlib.sha256(data).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit(f'postwrite mismatch: {name} sha256={actual_sha256}')
              print(f'EXACT {actual_sha256}  {name}')

          shutil.rmtree(chunk_root)
          workflow_path.unlink()
          PY

      - name: Commit exact originals and remove one-time materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess

          allowed_persistent = {
              'Cocolon_Piece/design_sources/Cocolon_Piece_Card_Image_Export_Redesign_DesignNote_20260707.md',
              'Cocolon_Piece/roadmap/Cocolon_Piece_ProFirst_ChatWork_Roadmap_20260807_CleanCutover_Revised.md',
              'Cocolon_Analysis/roadmap/Cocolon_Analysis_ProFirst_CurrentActual_ProductQualityClosure_Roadmap_20260807.md',
              'Cocolon_Analysis/simulation/Cocolon_WatashiSimulation_RouteBranch_DesignNote_20260708.md',
          }
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          for path in changed:
              if path in allowed_persistent:
                  continue
              if path == '.github/workflows/materialize_original_assets_once.yml':
                  continue
              if path.startswith('.github/materialize_original_assets/'):
                  continue
              raise SystemExit(f'unexpected changed path: {path}')
          print('CHANGED_PATHS')
          print('\n'.join(changed))
          PY
          git commit -m 'docs: preserve original Piece and Analysis sources exactly'
          git push origin HEAD:agent/three-core-cmee-current-structure-20260815
