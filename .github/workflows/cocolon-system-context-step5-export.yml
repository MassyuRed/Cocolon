name: Cocolon System Context Step 5 workflow export
run-name: Export current Step 5 workflow @ ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-step5-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cocolon-system-context-step5-workflow-export
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify workflow file exists
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/cocolon-system-context-inventory.yml
          sha256sum .github/workflows/cocolon-system-context-inventory.yml

      - name: Upload exact standard workflow
        uses: actions/upload-artifact@v4
        with:
          name: cocolon-step5-standard-workflow
          path: .github/workflows/cocolon-system-context-inventory.yml
          if-no-files-found: error
          retention-days: 1
