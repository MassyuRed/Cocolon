# retrigger_source_repair: cancel_old_queue_after_a7b2aa900ccdd3ff44fb2f57cf66ccd2fb3f4176
name: Cocolon System Context Step 5 packed-workspace repair
run-name: Repair fresh-clone verification @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - agent/cocolon-system-context-index-20260818
    paths:
      - .github/workflows/cocolon-system-context-step5-export.yml
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-step5-export.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step5-packed-workspace-repair-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      PREPARE_SOURCE: tools/cocolon_context_prepare.py
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Repair packed workspace verification, test, and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/cocolon_context_prepare.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _verify_workspace(\n')
          end = text.index('\ndef _compile_and_pack_task(\n', start)
          replacement = '''def _verify_workspace(
              *, repo_root: Path, workspace: str, workspace_dir: Path,
              refs: Mapping[str, RepositoryRef], profiles_path: Path,
          ) -> dict[str, Any]:
              """Verify published bytes, then semantic outputs from materialized logical files."""
              transport = verify_outputs(workspace_dir)
              with tempfile.TemporaryDirectory(
                  prefix="cocolon-workspace-verify-materialized-"
              ) as temporary:
                  materialized = materialize_outputs(
                      workspace_dir, Path(temporary) / "workspace"
                  )
                  verify_inventory(
                      profiles_path,
                      workspace,
                      {key: value.path for key, value in refs.items()},
                      materialized,
                  )
                  _run(
                      (
                          sys.executable,
                          str(repo_root / "tools/cocolon_context_code_index.py"),
                          "verify",
                          "--inventory",
                          str(materialized / "files.jsonl"),
                          "--output",
                          str(materialized / "code_index"),
                      ),
                      cwd=repo_root,
                  )
                  _run(
                      (
                          sys.executable,
                          str(repo_root / "tools/cocolon_context_routes.py"),
                          "verify",
                          "--inventory",
                          str(materialized / "files.jsonl"),
                          "--code-index",
                          str(materialized / "code_index"),
                          "--output",
                          str(materialized / "route_graph"),
                      ),
                      cwd=repo_root,
                  )
              return dict(transport)

'''
          updated = text[:start] + replacement + text[end + 1:]
          if updated.count('cocolon-workspace-verify-materialized-') != 1:
              raise SystemExit('materialized verification repair was not written exactly once')
          path.write_text(updated, encoding='utf-8')
          PY
          python3 -m pip install --disable-pip-version-check pytest==8.4.2
          python3 -m py_compile "$PREPARE_SOURCE"
          python3 -m unittest discover -s tests/cocolon_context -p 'test_*.py' -v
          python3 -m pytest tests/cocolon_context/test_task_context.py -q
          git diff --check -- "$PREPARE_SOURCE"
          git add -- "$PREPARE_SOURCE"
          test -n "$(git diff --cached --name-only -- "$PREPARE_SOURCE")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(system-context): verify packed workspace via logical materialization"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git rebase "refs/remotes/origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
