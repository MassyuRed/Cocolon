name: Cocolon System Context Step 5 final standard dispatcher
run-name: Dispatch final Step 5 standard run @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cocolon-system-context-step5-final-dispatch-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dispatch-final-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      STANDARD_WORKFLOW: cocolon-system-context-inventory.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert exact dispatch source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git status --porcelain)" = ""

      - name: Dispatch and require terminal-success standard run
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "$STANDARD_WORKFLOW" --ref "$TARGET_BRANCH"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUNS_JSON="$(gh run list \
              --workflow "$STANDARD_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,status,conclusion,createdAt)"
            RUN_ID="$(RUNS_JSON="$RUNS_JSON" python3 - <<'PY'
          import json
          import os

          source = os.environ["SOURCE_COMMIT"]
          runs = json.loads(os.environ["RUNS_JSON"])
          matches = [run for run in runs if run.get("headSha") == source]
          if matches:
              matches.sort(key=lambda run: int(run["databaseId"]), reverse=True)
              print(matches[0]["databaseId"])
          PY
            )"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "STANDARD_RUN_ID=$RUN_ID"

          set +e
          gh run watch "$RUN_ID" --exit-status
          WATCH_RC=$?
          set -e
          if [ "$WATCH_RC" -ne 0 ]; then
            gh run view "$RUN_ID" --log-failed || true
            exit "$WATCH_RC"
          fi

          RUN_STATE="$(gh run view "$RUN_ID" --json status,conclusion,headSha)"
          RUN_STATE="$RUN_STATE" python3 - <<'PY'
          import json
          import os

          source = os.environ["SOURCE_COMMIT"]
          state = json.loads(os.environ["RUN_STATE"])
          assert state["status"] == "completed", state
          assert state["conclusion"] == "success", state
          assert state["headSha"] == source, state
          PY

          FINAL_HEAD="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" \
            --jq '.object.sha')"
          echo "FINAL_HEAD=$FINAL_HEAD"
