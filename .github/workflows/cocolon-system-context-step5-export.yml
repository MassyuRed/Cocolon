name: Cocolon System Context Step 5 source export
run-name: Export current Step 5 prepare source @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - agent/cocolon-system-context-index-20260818
    paths:
      - .github/workflows/cocolon-system-context-step5-export.yml
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-step5-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cocolon-system-context-step5-source-export-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify prepare source exists
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/cocolon_context_prepare.py
          sha256sum tools/cocolon_context_prepare.py

      - name: Upload exact prepare source
        uses: actions/upload-artifact@v4
        with:
          name: cocolon-step5-prepare-source
          path: tools/cocolon_context_prepare.py
          if-no-files-found: error
          retention-days: 1
