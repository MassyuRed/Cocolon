name: Cocolon system context final Step 3 C payload binding bootstrap
on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-final-payload-binding-bootstrap.yml
permissions:
  contents: write
concurrency:
  group: cocolon-system-context-final-payload-binding-bootstrap
  cancel-in-progress: true
jobs:
  stage-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cocolon-system-context-index-20260818
          fetch-depth: 0
      - name: Bind final Step 3 C payload identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/cocolon-system-context-inventory.yml')
          target = Path('.github/context-payloads/step3-c/final_payload_bound_workflow.yml')
          text = source.read_text(encoding='utf-8')

          replacements = (
              (
                  'aad97baf4fa0f12b62023761be24bcf853a043e79baa043efc3571203c9f7548',
                  '48be5aaba408a39dfbd3331268e107f15b854da0b07ec08da29561f35a4dcba0',
                  'encoded Step 3 C payload',
              ),
              (
                  'fa4a3cc83d9e01c1217a529b874cbfdeb774e4f229f4d658ec94274bbeef9bb0',
                  'e03749be5161e6fcded6ca8d96fd7ca3c7dfc3c7e6170dad45c1902eb1433218',
                  'Step 3 C extension source',
              ),
          )
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} preimage mismatch')
              text = text.replace(old, new, 1)
              if old in text or text.count(new) != 1:
                  raise SystemExit(f'{label} postimage mismatch')

          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/context-payloads/step3-c/final_payload_bound_workflow.yml').read_text(encoding='utf-8')
          assert '48be5aaba408a39dfbd3331268e107f15b854da0b07ec08da29561f35a4dcba0' in text
          assert 'e03749be5161e6fcded6ca8d96fd7ca3c7dfc3c7e6170dad45c1902eb1433218' in text
          assert 'aad97baf4fa0f12b62023761be24bcf853a043e79baa043efc3571203c9f7548' not in text
          assert 'fa4a3cc83d9e01c1217a529b874cbfdeb774e4f229f4d658ec94274bbeef9bb0' not in text
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/context-payloads/step3-c/final_payload_bound_workflow.yml
          git diff --cached --check
          git commit -m "chore(context): stage final C payload binding [skip ci]"
          git push origin "HEAD:agent/cocolon-system-context-index-20260818"
