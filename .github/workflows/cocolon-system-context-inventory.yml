name: Cocolon System Context Step 5 incremental materialization
run-name: Materialize Step 5 incremental source @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - agent/cocolon-system-context-index-20260818
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step5-incremental/**
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step5-incremental/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step5-incremental-materialization-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PATCH_BASE_COMMIT: 3dd394431aa9699f3d21180783e1bfe50741ed6f
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      PAYLOAD: .github/context-payloads/step5-incremental
      WORKFLOW: .github/workflows/cocolon-system-context-inventory.yml
    steps:
      - name: Checkout exact staged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply genuine incremental patch, test, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -d "$PAYLOAD"
          test "$(git rev-parse "${PATCH_BASE_COMMIT}^{commit}")" = "$PATCH_BASE_COMMIT"
          git config core.quotePath false

          cat "$PAYLOAD"/part* | base64 -d | gzip -d > /tmp/step5-incremental.patch
          test -s /tmp/step5-incremental.patch

          # The payload was produced against PATCH_BASE_COMMIT. Restore only the
          # workflow bootstrap path before applying; all product/source files at
          # EXPECTED_HEAD already match that base.
          git show "${PATCH_BASE_COMMIT}:${WORKFLOW}" > "$WORKFLOW"
          git apply --check /tmp/step5-incremental.patch
          git apply /tmp/step5-incremental.patch

          python3 -m py_compile \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py \
            tools/cocolon_context_task.py \
            tools/cocolon_context_inventory.py \
            tools/cocolon_context_code_index.py \
            tools/cocolon_context_routes.py \
            tools/cocolon_context_publish_transport.py
          python3 -m unittest discover -s tests/cocolon_context -p 'test_*.py' -v
          git diff --check

          git diff --name-only -z | xargs -0 -r git add --
          git rm -r "$PAYLOAD"
          test -n "$(git diff --cached --name-only)"
          echo 'Staged Step 5 paths:'
          git diff --cached --name-status

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(system-context): implement genuine changed-ref incremental refresh"

          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_HEAD"
          git push origin "HEAD:${TARGET_BRANCH}"
