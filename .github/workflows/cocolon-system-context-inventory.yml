name: Cocolon System Context Step 5 final workflow materialization
run-name: Materialize PR-triggered Step 5 workflow @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step5-final-trigger/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step5-final-workflow-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      PAYLOAD: .github/context-payloads/step5-final-trigger
      STORED_WORKFLOW: Cocolon_前提資料/system_context/.step5_corrected_standard_entry_workflow.yml
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Materialize and publish PR-triggered final workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git status --porcelain)" = ""
          test -d "$PAYLOAD"
          git config core.quotePath false

          cat "$PAYLOAD"/part* | base64 -d > /tmp/step5-final.yml.gz
          echo "1c4a54913f06e12cd99034a179fa524730c3978038c58be4f004df35d8cd27c9  /tmp/step5-final.yml.gz" | sha256sum -c -
          gzip -dc /tmp/step5-final.yml.gz > /tmp/step5-final.yml
          echo "e3dd9090fd08bcbd858c7aaa5410ba5a78710bbc2b0e07f5fb2c6e605ca2eacb  /tmp/step5-final.yml" | sha256sum -c -
          grep -F 'pull_request:' /tmp/step5-final.yml
          grep -F 'github.event.pull_request.head.sha || github.sha' /tmp/step5-final.yml
          grep -F 'INCREMENTAL_SOURCE_DEPENDENT_CLOSURE' /tmp/step5-final.yml
          grep -F 'STEP5_COCOLON_STANDARD_ENTRY_CONNECTED' /tmp/step5-final.yml
          ! grep -F 'git add -A' /tmp/step5-final.yml

          install -m 0644 /tmp/step5-final.yml "$STORED_WORKFLOW"
          git add -- "$STORED_WORKFLOW"
          git rm -r "$PAYLOAD"

          python3 - <<'PY'
          import subprocess
          expected = {
              'Cocolon_前提資料/system_context/.step5_corrected_standard_entry_workflow.yml',
              '.github/context-payloads/step5-final-trigger/part000',
              '.github/context-payloads/step5-final-trigger/part001',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          assert actual == expected, (sorted(actual), sorted(expected))
          PY
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(system-context): materialize PR-triggered final Step 5 workflow"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_HEAD"
          git push origin "HEAD:${TARGET_BRANCH}"
