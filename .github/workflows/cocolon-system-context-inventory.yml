name: Cocolon system context identity diagnostic
run-name: Cocolon system context identity diagnostic @ ${{ github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step3-c/inspect_identity_contract.py

permissions:
  contents: read

concurrency:
  group: cocolon-system-context-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Cocolon context branch
        uses: actions/checkout@v4
        with:
          ref: agent/cocolon-system-context-index-20260818
          fetch-depth: 0

      - name: Print bounded identity contract source context
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/context-payloads/step3-c/inspect_identity_contract.py
