name: Cocolon System Context Step 5 verified source correction
run-name: Correct Step 5 source @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step5-correction/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step5-correction-v1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-correction:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CORRECTION_BASE_COMMIT: d64382472b9edd2623ed86f396ac38cc89b098a2
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      PAYLOAD: .github/context-payloads/step5-correction
      FINAL_WORKFLOW_COPY: Cocolon_前提資料/system_context/.step5_corrected_standard_entry_workflow.yml
    steps:
      - name: Checkout exact correction source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply exact4 correction and publish non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=.github/workflows/cocolon-system-context-inventory.yml
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -d "$PAYLOAD"
          test "$(git rev-parse "${CORRECTION_BASE_COMMIT}^{commit}")" = "$CORRECTION_BASE_COMMIT"
          cp "$WORKFLOW" /tmp/step5-correction-bootstrap.yml
          cat "$PAYLOAD"/part* | base64 -d | gzip -d > /tmp/step5-correction.patch
          echo "2bf3b2c570d3171abce908085d12698f05d3f11ccc75938374b058e501a78147  /tmp/step5-correction.patch" | sha256sum -c -
          git show "${CORRECTION_BASE_COMMIT}:${WORKFLOW}" > "$WORKFLOW"
          git apply --check /tmp/step5-correction.patch
          git apply /tmp/step5-correction.patch
          cp "$WORKFLOW" "$FINAL_WORKFLOW_COPY"
          cp /tmp/step5-correction-bootstrap.yml "$WORKFLOW"
          chmod 0644 \
            "$WORKFLOW" \
            "$FINAL_WORKFLOW_COPY" \
            tests/cocolon_context/test_prepare.py \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py
          python3 -m py_compile \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py \
            tests/cocolon_context/test_prepare.py
          python3 -m unittest \
            tests/cocolon_context/test_prepare.py \
            tests/cocolon_context/test_publication_transport_nested.py \
            -v
          git add -A \
            "$FINAL_WORKFLOW_COPY" \
            tests/cocolon_context/test_prepare.py \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py
          git rm -r "$PAYLOAD"
          test "$(git diff --cached --name-only -- "$WORKFLOW" | wc -l)" -eq 0
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'Cocolon_前提資料/system_context/.step5_corrected_standard_entry_workflow.yml',
              'tests/cocolon_context/test_prepare.py',
              'tools/cocolon_context.py',
              'tools/cocolon_context_prepare.py',
              '.github/context-payloads/step5-correction/part00',
              '.github/context-payloads/step5-correction/part01',
              '.github/context-payloads/step5-correction/part02',
              '.github/context-payloads/step5-correction/part03',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          assert actual == expected, (sorted(actual), sorted(expected))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(system-context): apply verified Step 5 source correction"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_HEAD"
          git push origin "HEAD:${TARGET_BRANCH}"
