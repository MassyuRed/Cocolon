name: Cocolon System Context Step 5 payload recovery
run-name: Recover staged Step 5 patch @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cocolon-system-context-step5-payload-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD: .github/context-payloads/step5-incremental
    steps:
      - name: Checkout exact staged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Recover every decodable patch byte
        shell: bash
        run: |
          set -euo pipefail
          cat "$PAYLOAD"/part* | base64 -d > /tmp/step5-incremental.patch.gz
          set +e
          gzip -dc /tmp/step5-incremental.patch.gz > /tmp/step5-incremental.partial.patch
          gzip_status=$?
          set -e
          test -s /tmp/step5-incremental.partial.patch
          printf '%s\n' "$gzip_status" > /tmp/gzip_status.txt
          wc -c -l /tmp/step5-incremental.partial.patch
          grep '^diff --git ' /tmp/step5-incremental.partial.patch || true
          tail -n 40 /tmp/step5-incremental.partial.patch

      - name: Upload recovered patch bytes
        uses: actions/upload-artifact@v4
        with:
          name: step5-incremental-partial-patch
          path: |
            /tmp/step5-incremental.partial.patch
            /tmp/gzip_status.txt
          if-no-files-found: error
          retention-days: 1
