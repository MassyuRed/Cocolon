name: Cocolon system context Step 3 C fresh verification
run-name: Cocolon system context C fresh @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - tools/cocolon_context_inventory.py
      - tools/cocolon_context_code_index.py
      - tools/cocolon_context_routes.py
      - tools/cocolon_context_routes_*.py
      - tools/cocolon_context_publish_transport.py
      - tools/cocolon_context_ts_syntax.cjs
      - tools/cocolon_context_ts_routes.cjs
      - tests/cocolon_context/**
      - Cocolon_前提資料/system_context/workspace_profiles.json
      - Cocolon_前提資料/system_context/Cocolon_SystemContext_ImplementationContract_20260818.md
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step2-code/**
      - .github/context-payloads/step3/**
      - .github/context-payloads/step3-c/**
      - .github/context-payloads/step3-ts-routes/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cocolon-system-context-step3-c-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fresh-verify-c1-c6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact Cocolon source
        uses: actions/checkout@v4
        with:
          ref: agent/cocolon-system-context-index-20260818
          fetch-depth: 0

      - name: Assert exact Cocolon source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git status --porcelain)" = ""

      - name: Checkout locked mashos-api CMEE workspace read-only
        uses: actions/checkout@v4
        with:
          repository: MassyuRed/mashos-api
          ref: agent/cmee-v1a-i1sx-source-explicit-20260815
          path: .cocolon-context-workspace/mashos-api
          fetch-depth: 0

      - name: Assert locked mashos-api identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .cocolon-context-workspace/mashos-api rev-parse HEAD)" = "06ce311b3ea728b06f83439d268a34bed917c01c"

      - name: Verify admitted Step 3 payload lineage
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_DIR=.github/context-payloads/step3
          ADMITTED_DIR=/tmp/cocolon-step3-admitted
          rm -rf "$ADMITTED_DIR"
          mkdir -p "$ADMITTED_DIR"
          cat "${PAYLOAD_DIR}"/part* > /tmp/cocolon-step3-payload.b64
          echo "d7893436ace9d1e7f8791b327473e3c11810c09bd72152f610934217267717dc  /tmp/cocolon-step3-payload.b64" | sha256sum -c -
          base64 -d /tmp/cocolon-step3-payload.b64 > /tmp/cocolon-step3-payload.tar.gz
          ACTUAL_LIST="$(tar -tzf /tmp/cocolon-step3-payload.tar.gz | LC_ALL=C sort)"
          EXPECTED_LIST="$(printf '%s\n' \
            tests/cocolon_context/test_code_index.py \
            tests/cocolon_context/test_routes.py \
            tools/cocolon_context_routes.py | LC_ALL=C sort)"
          test "$ACTUAL_LIST" = "$EXPECTED_LIST"
          tar -xzf /tmp/cocolon-step3-payload.tar.gz -C "$ADMITTED_DIR"
          echo "847303f952dd9fd6a7fd9540c5a42cf53751375cb35c86c863fc78d3bee4c3fe  ${ADMITTED_DIR}/tools/cocolon_context_routes.py" | sha256sum -c -
          echo "4d520138b2c92646bf97923a473a6548a2f108ac5f41076a9c7bd50c665aa60c  ${ADMITTED_DIR}/tests/cocolon_context/test_code_index.py" | sha256sum -c -
          echo "9a6f4d5d60ba7d17db5d4df10e27e84e9a1b7f253cb7555924327646364d02a8  ${ADMITTED_DIR}/tests/cocolon_context/test_routes.py" | sha256sum -c -

          C_PAYLOAD=.github/context-payloads/step3-c/payload.b64
          C_ADMITTED_DIR=/tmp/cocolon-step3-c-admitted
          rm -rf "$C_ADMITTED_DIR"
          mkdir -p "$C_ADMITTED_DIR"
          echo "25723b95ee9e7cb765edcd7c8c8a5d5a78f1bd6d8907f6e9b53147f630c57935  ${C_PAYLOAD}" | sha256sum -c -
          base64 -d "$C_PAYLOAD" > /tmp/cocolon-step3-c-payload.tar.gz
          C_ACTUAL_LIST="$(tar -tzf /tmp/cocolon-step3-c-payload.tar.gz | LC_ALL=C sort)"
          test "$C_ACTUAL_LIST" = "tools/cocolon_context_routes_c_extension.py"
          tar -xzf /tmp/cocolon-step3-c-payload.tar.gz -C "$C_ADMITTED_DIR"
          echo "0f56118fb481711eb767ec65f895a59496d8c9a5cb6e5249af7c9b8504b636bf  ${C_ADMITTED_DIR}/tools/cocolon_context_routes_c_extension.py" | sha256sum -c -

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned SCIP toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --no-audit --no-fund \
            @sourcegraph/scip-typescript@0.4.0 \
            @sourcegraph/scip-python@0.6.6 \
            typescript@5.2.2
          NODE_PATH="$(npm root -g)"
          export NODE_PATH
          echo "NODE_PATH=${NODE_PATH}" >> "$GITHUB_ENV"
          SCIP_TAG=v0.7.1
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/scip-code/scip/releases/download/${SCIP_TAG}/scip-linux-amd64.tar.gz" \
            -o /tmp/scip.tar.gz
          rm -rf /tmp/scip-bin
          mkdir -p /tmp/scip-bin
          tar -xzf /tmp/scip.tar.gz -C /tmp/scip-bin
          SCIP_BIN="$(find /tmp/scip-bin -type f -name scip -print -quit)"
          test -n "$SCIP_BIN"
          sudo install "$SCIP_BIN" /usr/local/bin/scip
          test "$(node --version)" = "v20.20.2"
          test "$(node -e "console.log(require('typescript').version)")" = "5.2.2"
          test "$(scip --version)" = "scip version v0.7.1"
          test "$(scip-typescript --version)" = "0.4.0"
          test "$(scip-python --version)" = "0.6.6"

      - name: Run focused and full system-context regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/cocolon_context_ts_syntax.cjs
          node --check tools/cocolon_context_ts_routes.cjs
          python3 -m py_compile \
            tools/cocolon_context_inventory.py \
            tools/cocolon_context_code_index.py \
            tools/cocolon_context_routes.py \
            tools/cocolon_context_publish_transport.py \
            tests/cocolon_context/test_routes.py
          python3 -m unittest tests/cocolon_context/test_inventory.py -v
          python3 -m unittest tests/cocolon_context/test_code_index.py -v
          python3 -m unittest tests/cocolon_context/test_routes.py -v
          python3 -m unittest tests/cocolon_context/test_routes_nested_registration.py -v
          python3 -m unittest tests/cocolon_context/test_publication_transport.py -v

      - name: Fresh Step 1 inventory build and verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT=Cocolon_前提資料/system_context/current/cmee_working
          rm -rf "$ROOT/code_index" "$ROOT/route_graph"
          rm -f "$ROOT/workflow_last_failure.json"
          python3 tools/cocolon_context_inventory.py build \
            --profiles Cocolon_前提資料/system_context/workspace_profiles.json \
            --workspace cmee_working \
            --repo Cocolon="${GITHUB_WORKSPACE}" \
            --repo mashos-api="${GITHUB_WORKSPACE}/.cocolon-context-workspace/mashos-api" \
            --output "$ROOT"
          python3 tools/cocolon_context_inventory.py verify \
            --profiles Cocolon_前提資料/system_context/workspace_profiles.json \
            --workspace cmee_working \
            --repo Cocolon="${GITHUB_WORKSPACE}" \
            --repo mashos-api="${GITHUB_WORKSPACE}/.cocolon-context-workspace/mashos-api" \
            --output "$ROOT"

      - name: Generate required precise SCIP exact3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cocolon-context-workspace/scip-step2
          mkdir -p .cocolon-context-workspace/scip-step2
          python3 tools/cocolon_context_code_index.py run-scip \
            --inventory Cocolon_前提資料/system_context/current/cmee_working/files.jsonl \
            --repo Cocolon="${GITHUB_WORKSPACE}" \
            --repo mashos-api="${GITHUB_WORKSPACE}/.cocolon-context-workspace/mashos-api" \
            --work .cocolon-context-workspace/scip-step2

      - name: Fresh Step 2 code index build and verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT=Cocolon_前提資料/system_context/current/cmee_working
          rm -rf "$ROOT/code_index"
          python3 tools/cocolon_context_code_index.py build \
            --inventory "$ROOT/files.jsonl" \
            --repo Cocolon="${GITHUB_WORKSPACE}" \
            --repo mashos-api="${GITHUB_WORKSPACE}/.cocolon-context-workspace/mashos-api" \
            --scip-work .cocolon-context-workspace/scip-step2 \
            --ts-helper tools/cocolon_context_ts_syntax.cjs \
            --output "$ROOT/code_index"
          python3 tools/cocolon_context_code_index.py verify \
            --inventory "$ROOT/files.jsonl" \
            --output "$ROOT/code_index"

      - name: Fresh C1-C6 route graph build and verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT=Cocolon_前提資料/system_context/current/cmee_working
          rm -rf "$ROOT/route_graph"
          python3 tools/cocolon_context_routes.py build \
            --inventory "$ROOT/files.jsonl" \
            --repo Cocolon="${GITHUB_WORKSPACE}" \
            --repo mashos-api="${GITHUB_WORKSPACE}/.cocolon-context-workspace/mashos-api" \
            --code-index "$ROOT/code_index" \
            --rn-helper tools/cocolon_context_ts_routes.cjs \
            --output "$ROOT/route_graph"
          python3 tools/cocolon_context_routes.py verify \
            --inventory "$ROOT/files.jsonl" \
            --code-index "$ROOT/code_index" \
            --output "$ROOT/route_graph"

      - name: Validate formal C1-C6 claim and canonical exact15
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("Cocolon_前提資料/system_context/current/cmee_working")
          route_root = root / "route_graph"
          expected_outputs = {
              "rn_calls.jsonl",
              "api_routes.jsonl",
              "cross_repository_route_edges.jsonl",
              "api_model_edges.jsonl",
              "backend_call_edges.jsonl",
              "route_owner_closures.jsonl",
              "test_contract_edges.jsonl",
              "file_domain_assignments.jsonl",
              "unresolved_rn_calls.jsonl",
              "unresolved_api_consumers.jsonl",
              "unresolved_backend_owners.jsonl",
              "unresolved_test_contracts.jsonl",
              "route_extraction_errors.jsonl",
              "route_graph_summary.json",
              "route_graph_manifest.json",
          }
          actual_outputs = {path.name for path in route_root.iterdir() if path.is_file()}
          assert actual_outputs == expected_outputs, (actual_outputs - expected_outputs, expected_outputs - actual_outputs)

          def read_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def read_jsonl(path: Path):
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line]

          inventory = read_json(root / "manifest.json")
          code = read_json(root / "code_index/code_index_summary.json")
          routes = read_json(route_root / "route_graph_summary.json")
          api_routes = read_jsonl(route_root / "api_routes.jsonl")
          route_edges = read_jsonl(route_root / "cross_repository_route_edges.jsonl")
          unresolved_api = read_jsonl(route_root / "unresolved_api_consumers.jsonl")

          assert inventory["completion_claim"] == "STEP1_FULL_TRACKED_FILE_POPULATION_COMPLETE"
          assert inventory["missing_tracked_path_count"] == 0
          assert inventory["duplicate_repository_path_count"] == 0
          assert code["completion_claim"] == "STEP2_SCIP_AND_SYNTAX_INDEX_CONNECTED"
          assert code["inventory_total"] == inventory["total_tracked_entries"]
          assert code["coverage_total"] == inventory["total_tracked_entries"]
          assert code["coverage_gap_count"] == 0
          assert code["duplicate_coverage_count"] == 0
          assert code["required_scip_runs_ok"] is True
          assert code["scip_precise_file_count"] > 0
          assert routes["completion_claim"] == "STEP3_RN_API_BACKEND_TEST_ROUTE_GRAPH_CONNECTED"
          assert routes["rn_call_count"] > 0
          assert routes["api_route_count"] > 0
          assert routes["cross_repository_edge_count"] > 0
          assert routes["backend_owner_coverage_count"] == routes["rn_connected_route_count"]
          assert routes["test_contract_coverage_count"] == routes["api_route_count"]
          assert routes["visible_consumer_coverage_count"] == routes["rn_call_count"]
          assert routes["domain_chain_node_coverage_count"] == routes["chain_node_file_count"]
          assert routes["silent_unresolved_count"] == 0
          assert routes["automatic_progression"] is False
          assert routes["product_credit"] == 0

          api_by_id = {row["route_id"]: row for row in api_routes}
          assert len(api_by_id) == len(api_routes)
          edge_ids = {row["api_route_id"] for row in route_edges}
          unresolved_by_id = {}
          for row in unresolved_api:
              assert "route_id" not in row
              subject_id = row["subject_id"]
              assert subject_id in api_by_id
              assert subject_id not in unresolved_by_id
              assert row["subject_kind"] == "API_ROUTE"
              route = api_by_id[subject_id]
              assert row["method"].upper() == route["method"].upper()
              assert row["route_path"] == route["route_path"]
              assert row["path"] == route["path"]
              assert row["reason"]
              unresolved_by_id[subject_id] = row
          for route_id, route in api_by_id.items():
              classification = route["consumer_classification"]
              if classification == "RN_CONSUMED":
                  assert route_id in edge_ids
                  assert route_id not in unresolved_by_id
              elif classification == "UNRESOLVED_CONSUMER":
                  assert route_id not in edge_ids
                  assert route_id in unresolved_by_id
              else:
                  assert route_id not in unresolved_by_id

          output_sha256 = {
              name: hashlib.sha256((route_root / name).read_bytes()).hexdigest()
              for name in sorted(expected_outputs)
          }
          final = {
              "source_commit": inventory["repositories"]["Cocolon"]["source_commit"],
              "source_tree": inventory["repositories"]["Cocolon"]["source_tree"],
              "mashos_api_commit": inventory["repositories"]["mashos-api"]["source_commit"],
              "inventory": inventory,
              "code_index": code,
              "route_graph": routes,
              "canonical_output_count": len(expected_outputs),
              "canonical_output_sha256": output_sha256,
              "unresolved_api_subject_count": len(unresolved_by_id),
              "completion_claim": routes["completion_claim"],
              "section_c": "COMPLETE",
              "section_d": "NOT_STARTED",
          }
          print("COCOLON_STEP3_C_FINAL_ACTUAL=" + json.dumps(final, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY
          git diff --check
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
