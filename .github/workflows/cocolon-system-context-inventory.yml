name: Cocolon system context Step 3 C static profile
run-name: Cocolon system context C static profile @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step3-c/profile_extension_static.py
      - .github/context-payloads/step3-c/payload.b64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cocolon-system-context-step3-c-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Cocolon context branch
        uses: actions/checkout@v4
        with:
          ref: agent/cocolon-system-context-index-20260818
          fetch-depth: 0

      - name: Inspect bounded C traversal source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/context-payloads/step3-c/profile_extension_static.py
