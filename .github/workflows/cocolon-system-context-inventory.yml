name: Cocolon System Context Step 5 source materialization
run-name: Materialize non-workflow Step 5 source @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - agent/cocolon-system-context-index-20260818
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-inventory.yml
      - .github/context-payloads/step5-source/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step5-source-v3-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize-source:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      PAYLOAD: .github/context-payloads/step5-source
      FINAL_WORKFLOW_COPY: Cocolon_前提資料/system_context/.step5_standard_entry_workflow.yml
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Materialize and commit non-workflow Step 5 source
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=.github/workflows/cocolon-system-context-inventory.yml
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -d "$PAYLOAD"
          cp "$WORKFLOW" /tmp/step5-bootstrap-workflow.yml
          cat "$PAYLOAD"/part* | base64 -d | gzip -d > /tmp/step5-source.patch
          echo "65120cc5780324bf1a0895813651736cba357e5706fe2fa39abf3fe10a5e0c2f  /tmp/step5-source.patch" | sha256sum -c -
          rm -f \
            "$WORKFLOW" \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py \
            tools/cocolon_context_publish_transport.py \
            tools/cocolon_context_inventory.py \
            tests/cocolon_context/test_prepare.py \
            tests/cocolon_context/test_publication_transport_nested.py \
            Cocolon_前提資料/work_attitude_rules_for_karen/00_read_first.txt \
            Cocolon_前提資料/system_context/00_read_first.md
          git apply --check /tmp/step5-source.patch
          git apply /tmp/step5-source.patch
          cp "$WORKFLOW" "$FINAL_WORKFLOW_COPY"
          cp /tmp/step5-bootstrap-workflow.yml "$WORKFLOW"
          chmod 0644 \
            "$WORKFLOW" \
            "$FINAL_WORKFLOW_COPY" \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py \
            tools/cocolon_context_publish_transport.py \
            tools/cocolon_context_inventory.py \
            tests/cocolon_context/test_prepare.py \
            tests/cocolon_context/test_publication_transport_nested.py \
            Cocolon_前提資料/work_attitude_rules_for_karen/00_read_first.txt \
            Cocolon_前提資料/system_context/00_read_first.md
          git add -A \
            "$FINAL_WORKFLOW_COPY" \
            tools/cocolon_context.py \
            tools/cocolon_context_prepare.py \
            tools/cocolon_context_publish_transport.py \
            tools/cocolon_context_inventory.py \
            tests/cocolon_context/test_prepare.py \
            tests/cocolon_context/test_publication_transport_nested.py \
            Cocolon_前提資料/work_attitude_rules_for_karen/00_read_first.txt \
            Cocolon_前提資料/system_context/00_read_first.md
          git rm -r "$PAYLOAD"
          test "$(git diff --cached --name-only -- "$WORKFLOW" | wc -l)" -eq 0
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(system-context): materialize Step 5 standard-entry source"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_HEAD"
          git push origin "HEAD:${TARGET_BRANCH}"
