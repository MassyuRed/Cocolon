name: Cocolon system context Step 4 actual
run-name: Cocolon Step 4 actual @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-step4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step4-actual-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  complete-step4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
    steps:
      - name: Checkout exact Step 4 source
        uses: actions/checkout@v4
        with:
          ref: agent/cocolon-system-context-index-20260818
          fetch-depth: 0

      - name: Inspect exact transport postimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile

          payload = pathlib.Path('.github/context-payloads/step4-transport')
          parts = sorted(payload.glob('part[0-9][0-9]'))
          assert len(parts) == 4
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'bd8e9fbea54178ec542124b4d8fbc80bae40a6dca872778d287af4bc4cecdbbb'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              members = [member for member in archive.getmembers() if member.isfile()]
              print('STEP4_TRANSPORT_ARCHIVE_MEMBERS=' + repr([member.name for member in members]), flush=True)
              assert [member.name for member in members] == ['tools/cocolon_context_task.py']
              stream = archive.extractfile(members[0])
              assert stream is not None
              source = stream.read().decode('utf-8')
          lines = source.splitlines()
          print('STEP4_TRANSPORT_TOOL_SHA256=' + hashlib.sha256(source.encode('utf-8')).hexdigest(), flush=True)
          print('STEP4_TRANSPORT_TOOL_LINE_COUNT=' + str(len(lines)), flush=True)
          start = max(1, len(lines) - 650)
          for number in range(start, len(lines) + 1):
              print(f'STEP4_TRANSPORT_TOOL_{number:04d}={lines[number - 1]}', flush=True)
          PY
