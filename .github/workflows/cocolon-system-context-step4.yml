name: Cocolon system context Step 4 actual
run-name: Cocolon Step 4 actual @ ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/cocolon-system-context-step4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocolon-system-context-step4-actual-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  complete-step4:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
    steps:
      - name: Checkout exact Step 4 source
        uses: actions/checkout@v4
        with:
          ref: agent/cocolon-system-context-index-20260818
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.2

      - name: Execute exact Step 4 remote runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import pathlib

          encoded = pathlib.Path('.github/context-payloads/step4-runner.b64').read_text(encoding='ascii').strip()
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'd1398d7d80020c1189edbf4821c1b3201f4799629e3c1848141651bbbc250966'
          source = gzip.decompress(packed)
          assert hashlib.sha256(source).hexdigest() == 'a98ba90c88449e76bda4be562ed91da74709984b7b0ccd64f3c847a90b80541a'
          text = source.decode('utf-8')
          needle = "assert {member.name for member in members} == expected"
          replacement = (
              "print('STEP4_TRANSPORT_ARCHIVE_ACTUAL_MEMBERS=' + repr(sorted(member.name for member in members)), flush=True)\n"
              "        print('STEP4_TRANSPORT_ARCHIVE_EXPECTED_MEMBERS=' + repr(sorted(expected)), flush=True)\n"
              "        assert {member.name for member in members} == expected"
          )
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          pathlib.Path('/tmp/cocolon_step4_remote_runner.py').write_text(text, encoding='utf-8')
          PY
          python3 /tmp/cocolon_step4_remote_runner.py
