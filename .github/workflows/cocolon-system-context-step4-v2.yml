name: Cocolon System Context Step 4 CMEE actual v2
run-name: Cocolon Step 4 CMEE actual v2 @ ${{ github.sha }}

on:
  push:
    branches:
      - agent/cocolon-system-context-index-20260818
    paths:
      - .github/workflows/cocolon-system-context-step4-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cocolon-system-context-step4-cmee-v2
  cancel-in-progress: true

jobs:
  compile-cmee-context:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET_BRANCH: agent/cocolon-system-context-index-20260818
      OUTPUT_REL: Cocolon_前提資料/system_context/current/cmee_working/task_context/cmee
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Cocolon branch
        uses: actions/checkout@v4
        with:
          ref: agent/cocolon-system-context-index-20260818
          fetch-depth: 0

      - name: Checkout locked CMEE tree
        uses: actions/checkout@v4
        with:
          repository: MassyuRed/mashos-api
          ref: 06ce311b3ea728b06f83439d268a34bed917c01c
          path: .cocolon-context-workspace/mashos-api
          fetch-depth: 1

      - name: Checkout locked Cycle001 inheritance tree
        uses: actions/checkout@v4
        with:
          repository: MassyuRed/mashos-api
          ref: 958c1b53f5b5894691e0b10e2d991fb8236d9f6f
          path: .cocolon-context-workspace/cycle001-mashos-api
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize task profile compatibility without widening scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path("Cocolon_前提資料/system_context/task_profiles.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          profiles = value.setdefault("profiles", {})
          profile = profiles.setdefault("cmee", {})
          exact10 = [
              "current_production_emlis_ai",
              "nlsv3_cycle001",
              "cmee_draft_implementation",
              "piece_current_future",
              "analysis_current_future",
              "shared_text_generation_core",
              "rn_display_surface",
              "api_boundary",
              "protected_tests",
              "relevant_historical_design",
          ]
          profile["task_id"] = "cmee"
          profile["workspace"] = "cmee_working"
          profile["required_categories"] = exact10
          profile["required_category_ids"] = exact10
          profile.setdefault("domains", ["CMEE", "EMLIS_AI", "PIECE", "ANALYSIS", "GLOBAL"])
          profile.setdefault("current_owner_paths", [
              "Cocolon_前提資料/current_structure/00_three_core_and_cmee_read_first.md",
              "Cocolon_前提資料/current_structure/01_emlis_ai_current_structure.md",
              "Cocolon_前提資料/current_structure/02_piece_current_structure.md",
              "Cocolon_前提資料/current_structure/03_analysis_current_structure.md",
              "Cocolon_前提資料/current_structure/04_cmee_current_structure.md",
              "Cocolon_前提資料/designs/cmee/Cocolon_MeaningExperienceEngine_V1_FinalTechnicalDesign_ProReviewApplied_20260815.md",
              "Cocolon_前提資料/designs/cmee/NLSv3_to_CMEE_Disposition_Phase1_20260817.md",
              "Cocolon_前提資料/designs/cmee/v1/00_read_first.md",
              "Cocolon_前提資料/designs/cmee/v1/01_shared_kernel_and_runtime_contracts.md",
              "Cocolon_前提資料/designs/cmee/v1/02_emlis_v1a_detailed_design.md",
              "Cocolon_前提資料/designs/cmee/v1/03_piece_v1c_detailed_design.md",
              "Cocolon_前提資料/designs/cmee/v1/04_analysis_v1d_v1e_detailed_design.md",
              "Cocolon_前提資料/designs/cmee/v1/05_json_schema_and_versioning.md",
              "Cocolon_前提資料/designs/cmee/v1/06_implementation_order_migration_and_verification.md",
          ])
          profile.setdefault("seed_paths", profile["current_owner_paths"])
          profile.setdefault("seed_path_prefixes", [
              "Cocolon_前提資料/current_structure/",
              "Cocolon_前提資料/designs/cmee/",
              "ai/services/ai_inference/cocolon_meaning_experience_engine/",
              "ai/services/ai_inference/cocolon_text_generation_core/",
          ])
          profile.setdefault("read_classifications", [
              "MUST_READ_FULL", "REFERENCE_AS_NEEDED", "CURRENT_OWNER",
              "RELEVANT_HISTORICAL", "UNRESOLVED_CONTEXT",
          ])
          profile.setdefault("external_exact_assets", [{
              "category_id": "nlsv3_cycle001",
              "repository": "MassyuRed/mashos-api",
              "repository_key": "mashos-api-cycle001",
              "source_commit": "958c1b53f5b5894691e0b10e2d991fb8236d9f6f",
              "paths": [
                  "ai/services/ai_inference/emlis_ai_step11_cycle001_product_recovery_v3.py",
                  "ai/tests/test_emlis_nls_v3_s11_cycle001_product_recovery_v3.py",
                  "ai/tools/emlis_nls_v3_step11_current_rc_g8_run.py",
              ],
              "disposition": "READ_ONLY_INHERITANCE_EVIDENCE_NOT_OVERLAID_INTO_CMEE_TREE",
          }])
          value["tasks"] = {"cmee": dict(profile)}
          value["default_task"] = "cmee"
          path.write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Test and execute exact public CLI
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/cocolon_context.py
          test -f tools/cocolon_context_task.py
          test -f tests/cocolon_context/test_task_context.py
          python3 -m py_compile tools/cocolon_context.py tools/cocolon_context_task.py tests/cocolon_context/test_task_context.py
          python3 -m unittest tests/cocolon_context/test_task_context.py -v 2>&1 | tee /tmp/step4-tests.log
          rm -rf "$OUTPUT_REL"
          python3 -m tools.cocolon_context context --workspace cmee_working --task cmee | tee /tmp/step4-cli.log

      - name: Validate canonical exact8 and required category exact10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          root = Path(os.environ["OUTPUT_REL"])
          exact8 = {
              "context_manifest.json", "selected_files.jsonl", "closure_edges.jsonl",
              "required_category_coverage.json", "unresolved_context.jsonl",
              "full_text_read_order.md", "cmee_context_overview.md",
              "cmee_unincorporated_actual_findings.md",
          }
          assert root.is_dir()
          assert {p.name for p in root.iterdir() if p.is_file()} == exact8
          manifest = json.loads((root / "context_manifest.json").read_text(encoding="utf-8"))
          selected = [json.loads(x) for x in (root / "selected_files.jsonl").read_text(encoding="utf-8").splitlines() if x]
          edges = [json.loads(x) for x in (root / "closure_edges.jsonl").read_text(encoding="utf-8").splitlines() if x]
          unresolved = [json.loads(x) for x in (root / "unresolved_context.jsonl").read_text(encoding="utf-8").splitlines() if x]
          coverage = json.loads((root / "required_category_coverage.json").read_text(encoding="utf-8"))
          rows = coverage.get("categories") or coverage.get("required_categories") or []
          if isinstance(rows, dict):
              rows = [{"category_id": k, **(v if isinstance(v, dict) else {"selected_count": v})} for k, v in rows.items()]
          counts = {
              str(row.get("category_id") or row.get("category") or row.get("name")):
              int(row.get("selected_count", row.get("count", row.get("file_count", 0))) or 0)
              for row in rows if isinstance(row, dict)
          }
          expected = {
              "current_production_emlis_ai", "nlsv3_cycle001", "cmee_draft_implementation",
              "piece_current_future", "analysis_current_future", "shared_text_generation_core",
              "rn_display_surface", "api_boundary", "protected_tests", "relevant_historical_design",
          }
          assert set(counts) == expected, counts
          assert all(v > 0 for v in counts.values()), counts
          assert selected and all(row.get("path") and row.get("source_commit") for row in selected)
          assert manifest.get("context_fingerprint")
          assert manifest.get("completion_claim") == "STEP4_TASK_CONTEXT_COMPILER_CMEE_ACTUAL_REVIEW_COMPLETE"
          assert manifest.get("automatic_progression") is False
          assert manifest.get("product_credit") == 0
          for name, expected_hash in (manifest.get("output_sha256") or {}).items():
              path = root / name
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected_hash
          tests = Path("/tmp/step4-tests.log").read_text(encoding="utf-8", errors="replace")
          match = re.search(r"Ran\s+(\d+)\s+tests?", tests)
          actual = {
              "selected_file_count": len(selected),
              "closure_edge_count": len(edges),
              "unresolved_context_count": len(unresolved),
              "category_counts": dict(sorted(counts.items())),
              "context_fingerprint": manifest["context_fingerprint"],
              "completion_claim": manifest["completion_claim"],
              "output_sha256": dict(sorted((manifest.get("output_sha256") or {}).items())),
              "test_count": int(match.group(1)) if match else None,
              "automatic_progression": False,
              "product_credit": 0,
          }
          Path("/tmp/step4-actual.json").write_text(json.dumps(actual, ensure_ascii=False, sort_keys=True), encoding="utf-8")
          PY

      - name: Commit exact4 and actual context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotePath false
          git add -- tools/cocolon_context.py tools/cocolon_context_task.py tests/cocolon_context/test_task_context.py 'Cocolon_前提資料/system_context/task_profiles.json' "$OUTPUT_REL"
          git diff --cached --check
          if git diff --cached --quiet; then
            git commit --allow-empty -m "docs(context): remote-verify Step 4 CMEE context [skip ci]"
          else
            git commit -m "feat(context): complete Step 4 CMEE actual context [skip ci]"
          fi
          echo "GENERATED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Fresh remote verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          REMOTE_HEAD=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          test "$REMOTE_HEAD" = "$GENERATED_HEAD"
          rm -rf /tmp/cocolon-step4-v2-remote
          git worktree add --detach /tmp/cocolon-step4-v2-remote "$REMOTE_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path("/tmp/cocolon-step4-v2-remote") / os.environ["OUTPUT_REL"]
          manifest = json.loads((root / "context_manifest.json").read_text(encoding="utf-8"))
          assert manifest["completion_claim"] == "STEP4_TASK_CONTEXT_COMPILER_CMEE_ACTUAL_REVIEW_COMPLETE"
          for name, expected in manifest["output_sha256"].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected
          print("STEP4_FRESH_REMOTE_VERIFICATION=PASS")
          PY
          git worktree remove --force /tmp/cocolon-step4-v2-remote
          echo "REMOTE_HEAD=$REMOTE_HEAD" >> "$GITHUB_ENV"

      - name: Update PR body after remote PASS only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, urllib.request
          actual = json.loads(Path("/tmp/step4-actual.json").read_text(encoding="utf-8"))
          root = Path(os.environ["OUTPUT_REL"])
          manifest_sha = hashlib.sha256((root / "context_manifest.json").read_bytes()).hexdigest()
          findings = (root / "cmee_unincorporated_actual_findings.md").read_text(encoding="utf-8")
          finding_count = findings.count("## Finding ")
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/MassyuRed/Cocolon/pulls/31"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cocolon-step4-v2",
          }
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers)) as response:
              current = json.load(response)
          body = current.get("body") or ""
          begin = "<!-- COCOLON_STEP4_BEGIN -->"
          end = "<!-- COCOLON_STEP4_END -->"
          categories = "\n".join(f"- `{k}`: `{v}`" for k, v in actual["category_counts"].items())
          outputs = "\n".join(f"- `{k}`: `{v}`" for k, v in actual["output_sha256"].items())
          section = f'''{begin}

## Step 4 — Task Context Compiler／CMEE actual review

- final remote HEAD: `{os.environ["REMOTE_HEAD"]}`
- selected files: `{actual["selected_file_count"]}`
- closure edges: `{actual["closure_edge_count"]}`
- unresolved context rows retained: `{actual["unresolved_context_count"]}`
- actual finding count: `{finding_count}`
- context fingerprint: `{actual["context_fingerprint"]}`
- context manifest SHA-256: `{manifest_sha}`
- compiler tests: `{actual.get("test_count") or "PASS"}`
- fresh remote hash verification: `PASS`

### Required category exact10

{categories}

### Canonical output SHA-256

{outputs}

- full-text read order: `generated`
- selected identities: `verified`
- actual findings: `recorded and used for CMEE review`
- structure map: `STRUCTURE_MAP_DELTA_NONE`
- completion claim: `STEP4_TASK_CONTEXT_COMPILER_CMEE_ACTUAL_REVIEW_COMPLETE`

```text
区切りA: COMPLETE
区切りB: COMPLETE
区切りC: COMPLETE
区切りD: COMPLETE
Step 3 checkpoint: COMPLETE
Step 4 checkpoint: COMPLETE
Step 5: NOT STARTED
```

- product／RN／API／DB／migration effect: `0`
- mashos-api write: `0`
- product quality credit: `0`
- primary outcome: `TECHNICAL_CREDIT`
- PR: `Draft / open / unmerged`
- ready conversion／merge／Step 5 automatic progression: `0`
- automatic progression: `false`

{end}'''
          if begin in body and end in body:
              prefix, tail = body.split(begin, 1)
              _, suffix = tail.split(end, 1)
              body = prefix.rstrip() + "\n\n" + section + suffix
          else:
              body = body.rstrip() + "\n\n" + section + "\n"
          payload = json.dumps({"body": body}, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(api, data=payload, method="PATCH", headers={**headers, "Content-Type": "application/json"})
          with urllib.request.urlopen(request) as response:
              updated = json.load(response)
          assert updated["draft"] is True and updated["state"] == "open"
          assert "STEP4_TASK_CONTEXT_COMPILER_CMEE_ACTUAL_REVIEW_COMPLETE" in (updated.get("body") or "")
          print("STEP4_PR_BODY_UPDATE=PASS")
          PY

      - name: Record causal failure in job summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Step 4 v2 failed'
            echo
            echo 'The run stopped before the completion claim or PR update. Only the first failing step is causal; no Step 5 progression occurred.'
          } >> "$GITHUB_STEP_SUMMARY"
